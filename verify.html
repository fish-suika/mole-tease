<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>検証 — 叩かれないモグラ</title>
<style>
  body{font-family:"Yu Gothic UI",system-ui,sans-serif;background:#1c1c1e;color:#eee;padding:24px;line-height:1.7}
  h1{font-size:18px;margin-bottom:16px}
  .r{padding:4px 0;border-bottom:1px solid #333}
  .ok::before{content:"PASS ";color:#6bd07a;font-weight:bold}
  .ng::before{content:"FAIL ";color:#ff6b6b;font-weight:bold}
  .ng{color:#ffb0b0}

</style>

<body>
<h1>叩かれないモグラ — 検証</h1>
<div id="out"></div>
<div id="sum"></div>
<script>
"use strict";
// ===== 調整用の数値（遊んで直す） =====
// 穴は 3×3。行 0＝奥（人間に近い）、行 2＝手前（こちらに近い）。座標の単位はおもちゃの台の「メートルもどき」
const CFG = {
  duration: 60,           // 逃げきりまでの秒数
  maxBumps: 3,            // たんこぶがこの数で終わり
  holes: { dx: 1.8, dz: 2.1, z0: -2.1, r: 0.8 },   // 穴の間隔（横・奥行き）、いちばん奥の行の z、穴の半径
  mole: {
    rise: 7.5,            // 出る速さ（高さ 0〜1 を毎秒）
    fall: 9,              // 引っ込む速さ
    moveTime: 0.2,        // 別の穴へ地下を移る時間
    hitH: 0.3,            // この高さより上に出ていたら叩かれる
    exposeH: 0.5,         // この高さ以上で「顔を出している」＝人間に見つかる・点が入る
    flatH: 0.4,           // 叩かれてつぶれた高さ
    flatTime: 0.35,       // つぶれたままの時間
    stunTime: 0.9,        // 叩かれてから出られない時間
  },
  human: {
    firstWait: 1.6,       // 開始してから最初に狙うまでの待ち

    windup: 0.70,         // 振りかぶり（予告）の長さ
    strike: 0.12,         // 振り下ろしの長さ
    recoverMiss: 0.55,    // 空振り後に次を狙えるまで
    recoverHit: 1.0,      // 当てたあと
    idleWait: 0.15,       // 次を狙う前のひと呼吸
    minWindup: 0.45,      // 怒りで速くなっても、振りかぶりはこれ未満にしない（見てから避けられる下限）
    feintAt: 0.8,         // フェイントは振りかぶりのこの割合で止めて引く（ハンマーを上げきらない）
    recoverFeint: 0.6,    // フェイントのあと次を狙えるまで（途中まで振り下ろして止め、にやりと笑う間）
    recoverStray: 0.8,    // 隣を叩いてしまったあと（ぽかんとする間）
    flailWindup: 0.4,     // 連打（せっかちな子ども）の振りかぶり。モグラが出ていないときに始まる素振りなので、反応時間の下限は考えない
    ambushWindup: 0.5,    // 待ち伏せ中に同じ穴から出たときの、素早い振りかぶり
    ambushReaction: 0.12, // 待ち伏せ中に気づくまで
    recoverAmbush: 0.25,  // 待ち伏せをあきらめたあと
  },
  // 怒り（0〜max）：空振りで上がる（ギリギリなほど大きく）、時間でさめる、叩くと少し下がる。段階は th 以上で上がり、点の倍率＝段階（×1〜×5）
  rage: { max: 100, whiffBase: 0.5, whiffNear: 6.5 },   // 時間ではさめない。叩かれたら persons の hitKeep 倍に下がる（0＝リセット）
  stages: [
    { name: '平静', th: 0,  windupMul: 1.0,  feint: 0,    reach: 0, hammers: 1, scale: 1 },
    { name: 'むっ', th: 18, windupMul: 0.88, feint: 0,    reach: 0, hammers: 1, scale: 1 },
    { name: 'ムキ', th: 42, windupMul: 0.8,  feint: 0.18, reach: 0, hammers: 1, scale: 1.1 },
    { name: '激怒', th: 68, windupMul: 0.75, feint: 0.18, reach: 1, hammers: 1, scale: 1.7 },   // 巨大ハンマー：左右の隣の穴まで届く
    { name: '錯乱', th: 88, windupMul: 0.75, feint: 0.22, reach: 1, hammers: 2, scale: 1.7 },   // 2本同時
  ],
  // 叩く人 3人（毎回ランダムに 1人）。windupMul＝振りかぶりの長さの倍率、reaction＝気づくまで、missMul＝空振り後の立ち直りの倍率（小さいほどすぐ次を叩く）、flail＝空振りのあと、同じ穴を続けて振る回数（連打。使っていない。待ち時間でテンポが悪くなるので子どもからは外した。検証用に残してある）、feint＝フェイント率、ambush＝待ち伏せの秒数、rageUp＝怒りの上がりやすさ、hitKeep＝叩いたあとに残る怒りの割合（0＝すっきりリセット）
  // stray＝隣の穴を叩く率（使っていない。バグに見えるので子どもの癖としては外した。検証用に残してある）
  persons: [
    { id: 'kid',    name: 'せっかちな子ども',     windupMul: 0.62, reaction: 0.30, stray: 0, missMul: 0.85, flail: 0, feint: 0,    ambush: 0,   rageUp: 0.95,  hitKeep: 0 },
    { id: 'uncle',  name: '負けず嫌いのおじさん', windupMul: 1.0,  reaction: 0.30, stray: 0, missMul: 1,   flail: 0, feint: 0.22, ambush: 0,   rageUp: 1.0,  hitKeep: 0.4 },
    { id: 'granny', name: '正確なおばあちゃん',   windupMul: 1.1,  reaction: 0.30, stray: 0, missMul: 1,   flail: 0, feint: 0,    ambush: 1.3, rageUp: 1.35, hitKeep: 0 },
  ],
  score: {
    pps: 100,             // 顔を出している間の毎秒の点
    whiffBase: 50,        // 空振りさせたときの基本点
    whiffNear: 450,       // ギリギリなほど足される点（closeness の2乗で効く）
    nearWindow: 0.30,     // 人間が叩く直前、何秒以内に引っ込んだらギリギリとみなすか
    scoreH: 0.5,          // この高さ以上で点が入る
  },
  // カメラ：モグラの目の高さ。台の手前の端から奥の人間を見上げる／少し見下ろす
  cam: { pos: [0, 6.0, 7.2], look: [0, 2.4, -1.6], hfov: 48 },
  // X 共有（url は公開先。空ならいま開いているページ）
  share: { hashtag: '叩かれないモグラ', url: 'https://fish-suika.github.io/mole-tease/' },
  // タイミングバー（振りかぶりの間だけ出る補助）。zoneFrom＝ここから先で離すと「ギリギリ」（ギリギリ度の下限）、assist＝false で非表示
  assist: { bar: false, zoneNear: 0.35 },
  // モグラが出ている間は一人称視点：カメラがモグラの目の位置へ降りる（引っ込むと元の俯瞰）。amt＝0 で無効
  // eyeBase＋eyeK×高さ＝目の高さ、back＝穴の中心より後ろへ、pitch＝見上げる角度（度）、windupPitch＝振りかぶりのあいだ頭上のハンマーを見上げる分（度）、hideAt＝この寄り具合を超えたらモグラの体を隠す（鼻と手だけ残す）
  fps: { amt: 1, eyeBase: 0.08, eyeK: 0.92, back: 0.45, pitch: 11, lookDist: 10, lookXk: 0.25, rate: 9, hideAt: 0.35, fov: 84, windupPitch: 42, tiltRate: 6 },
};
// 録画用の隠しスイッチ：URL の末尾に ?view=top を付けると一人称視点を切り、ずっと俯瞰のままにする（ふだんの遊びには影響しない）
try { if (new URLSearchParams(location.search).get('view') === 'top') CFG.fps.amt = 0; } catch (e) {}
// ===== 判定・点数・人間の動き（three.js を使わない純粋ロジック） =====
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const easeOut = t => 1 - Math.pow(1 - t, 3);

// 穴 i（0〜8）の台上の位置。行 0＝奥、行 2＝手前
function holePos(i, CFG) {
  const H = CFG.holes;
  return { x: (i % 3 - 1) * H.dx, z: H.z0 + Math.floor(i / 3) * H.dz };
}
const rowOf = i => Math.floor(i / 3), colOf = i => i % 3;

// 画面の座標（px）から押している穴を決める。cur＝今押している穴、hyst＝今の穴を離れにくくする倍率
function pickHole(px, py, pts, cur, hyst) {
  let best = -1, bd = Infinity;
  for (let i = 0; i < pts.length; i++) {
    const d = Math.hypot(pts[i].x - px, pts[i].y - py);
    if (d < bd) { bd = d; best = i; }
  }
  if (cur >= 0 && cur < pts.length && cur !== best) {
    const dc = Math.hypot(pts[cur].x - px, pts[cur].y - py);
    if (dc <= bd * (hyst || 1.25)) return cur;
  }
  return best;
}

// ---- モグラ ----
function newMole() {
  return { hole: 4, h: 0, dest: -1, travel: 0, stun: 0, hitT: 99, upSince: -1, exitTs: new Array(9).fill(-99) };
}

// press＝押している穴（なければ -1）、now＝ゲーム内の経過秒
function moleStep(m, dt, press, now, CFG) {
  const M = CFG.mole;
  const hPrev = m.h;
  m.hitT += dt;
  if (m.stun > 0) {
    m.stun = Math.max(0, m.stun - dt);
    m.travel = 0; m.dest = -1;
    if (m.stun > M.stunTime - M.flatTime) m.h = M.flatH;
    else m.h = Math.max(0, m.h - M.fall * dt);
  } else if (press >= 0 && press !== m.hole) {
    // 別の穴へ：いまの穴で引っ込み、地下を移ってから出る
    if (m.h > 0) m.h = Math.max(0, m.h - M.fall * dt);
    else {
      if (m.dest !== press) { m.dest = press; m.travel = M.moveTime; }
      m.travel -= dt;
      if (m.travel <= 0) { m.hole = m.dest; m.dest = -1; m.travel = 0; }
    }
  } else if (press === m.hole) {
    m.dest = -1; m.travel = 0;
    m.h = Math.min(1, m.h + M.rise * dt);
  } else {
    m.dest = -1; m.travel = 0;
    m.h = Math.max(0, m.h - M.fall * dt);
  }
  if (hPrev > M.hitH && m.h <= M.hitH) m.exitTs[m.hole] = now;     // 叩かれる高さを離れた時刻（ギリギリ度に使う）
  if (m.h >= M.exposeH && m.stun <= 0) { if (m.upSince < 0) m.upSince = now; } else m.upSince = -1;
}

function isHittable(m, CFG) { return m.stun <= 0 && m.travel === 0 && m.h > CFG.mole.hitH; }

// ---- 人間（3人の癖・怒りの段階つき） ----
function pickPerson(rng, CFG) { return CFG.persons[Math.min(CFG.persons.length - 1, Math.floor(rng() * CFG.persons.length))]; }
function stageOf(rage, CFG) { let s = 0; for (let i = 0; i < CFG.stages.length; i++) if (rage >= CFG.stages[i].th) s = i; return s; }
// 振りかぶりの長さ：人の癖 × 怒りの段階。短くしすぎない（見てから避けられる下限 minWindup）
function windupDur(P, S, CFG) { return Math.max(CFG.human.minWindup, CFG.human.windup * P.windupMul * S.windupMul); }

function newHuman(CFG, person) {
  // seq＝フェーズが変わるたびに増える（見た目の切り替え用）。target2＝2本目のハンマーの穴（怒り最大のとき）
  return { person, phase: 'idle', t: 0, seq: 0, wait: CFG.human.firstWait, target: -1, target2: -1, dur: 0, stage: 0, feint: false, strayed: false, lastStray: false, flail: false, flailLeft: 0, sawMole: false, recover: 0, mood: 'calm' };
}

// 振りかぶりを始める。mode：true＝待ち伏せからの素早い振りかぶり、'flail'＝連打（空振りのあと続けて振る）
function startWindup(hu, hole, mode, ctx, CFG) {
  const P = hu.person, S = CFG.stages[ctx.stage], flail = mode === 'flail', ambush = mode === true;
  hu.phase = 'windup'; hu.t = 0; hu.seq++; hu.mood = 'aim'; hu.stage = ctx.stage;
  hu.target = hole; hu.strayed = false; hu.feint = false; hu.target2 = -1; hu.flail = flail; hu.sawMole = false;
  if (!ambush && !flail) {
    // 雑：ときどき隣（左右）の穴を狙ってしまう。続けては起こさない（バグに見えるので）
    if (P.stray > 0 && !hu.lastStray && ctx.rng() < P.stray) {
      const c = colOf(hole), opts = []; if (c > 0) opts.push(hole - 1); if (c < 2) opts.push(hole + 1);
      hu.target = opts[Math.min(opts.length - 1, Math.floor(ctx.rng() * opts.length))]; hu.strayed = true;
    }
    hu.feint = ctx.rng() < clamp(P.feint + S.feint, 0, 0.6);
  }
  hu.lastStray = hu.strayed;
  hu.dur = flail ? CFG.human.flailWindup : ambush ? CFG.human.ambushWindup : windupDur(P, S, CFG);
  if (S.hammers >= 2 && !hu.feint && !flail) {                       // 2本目：ちがう行のどこか（行を変えるだけでは逃げきれない）
    const r2 = (rowOf(hu.target) + 1 + Math.min(1, Math.floor(ctx.rng() * 2))) % 3;
    hu.target2 = r2 * 3 + Math.min(2, Math.floor(ctx.rng() * 3));
  }
  return { type: 'windup', hole: hu.target, hole2: hu.target2, dur: hu.dur, feint: hu.feint, stray: hu.strayed, ambush: ambush, flail };
}

function goPhase(hu, phase, mood) { hu.phase = phase; hu.t = 0; hu.seq++; if (mood) hu.mood = mood; }

// 人間の 1 コマ。出来事（windup / strike / feint / impact）を配列で返す。ctx＝{ stage, rng }
function humanStep(hu, dt, m, now, CFG, ctx) {
  const Hc = CFG.human, P = hu.person, ev = [];
  hu.t += dt;
  if (hu.flail && m.stun <= 0 && m.upSince >= 0 && m.hole === hu.target) hu.sawMole = true;   // 連打の最中にモグラが出てきたか（出てきたなら、避けたら普通の空振り扱い）
  if (hu.phase === 'idle') {
    hu.wait -= dt;
    if (hu.wait <= 0 && m.stun <= 0 && m.upSince >= 0 && now - m.upSince >= P.reaction) ev.push(startWindup(hu, m.hole, false, ctx, CFG));
  } else if (hu.phase === 'ambush') {
    // 待ち伏せ：空振りした穴の上でハンマーを構えたまま待つ。同じ穴から出直すと素早く叩く
    if (m.stun <= 0 && m.hole === hu.target && m.upSince >= 0 && now - m.upSince >= Hc.ambushReaction) ev.push(startWindup(hu, hu.target, true, ctx, CFG));
    else if (hu.t >= P.ambush) { goPhase(hu, 'recover', 'calm'); hu.recover = Hc.recoverAmbush; }
  } else if (hu.phase === 'windup') {
    if (hu.feint && hu.t >= hu.dur * Hc.feintAt) {         // フェイント：ハンマーを上げきらずに止めて、引く
      ev.push({ type: 'feint', hole: hu.target });
      goPhase(hu, 'recover', 'feint'); hu.recover = Hc.recoverFeint;
    } else if (hu.t >= hu.dur) { goPhase(hu, 'strike'); ev.push({ type: 'strike', hole: hu.target, hole2: hu.target2 }); }
  } else if (hu.phase === 'strike') {
    if (hu.t >= Hc.strike) {
      const S = CFG.stages[hu.stage];
      const cover = t => t >= 0 && rowOf(m.hole) === rowOf(t) && Math.abs(colOf(m.hole) - colOf(t)) <= S.reach;   // 巨大ハンマーは左右の隣の穴まで届く
      const hit = isHittable(m, CFG) && (cover(hu.target) || cover(hu.target2));
      const stray = !hit && hu.strayed && m.hole !== hu.target;
      const empty = !hit && hu.flail && !hu.sawMole;          // 連打の素振り（モグラがいなかった）：避けたことにならず、点も怒りもなし
      let gap = null, close = 0;
      if (!hit && !stray && !empty) {
        gap = Math.max(0, now - m.exitTs[hu.target]);
        close = clamp(1 - gap / CFG.score.nearWindow, 0, 1);
      }
      ev.push({ type: 'impact', hole: hu.target, hole2: hu.target2, hit, stray, empty, gap, close });
      if (hit) { hu.flailLeft = 0; goPhase(hu, 'recover', 'happy'); hu.recover = Hc.recoverHit; }
      else if (!stray && P.flail > 0 && (!empty || hu.flailLeft > 0)) {
        if (!empty) hu.flailLeft = P.flail;                   // 本物の空振りのあと、続けて振り回す
        if (hu.flailLeft > 0) { hu.flailLeft--; ev.push(startWindup(hu, hu.target, 'flail', ctx, CFG)); }
        else { goPhase(hu, 'recover', 'miss'); hu.recover = Hc.recoverMiss * (P.missMul || 1); }
      }
      else if (!stray && P.ambush > 0) goPhase(hu, 'ambush', 'aim');
      else if (stray) { goPhase(hu, 'recover', 'confuse'); hu.recover = Hc.recoverStray; }
      else { goPhase(hu, 'recover', 'miss'); hu.recover = Hc.recoverMiss * (P.missMul || 1); }   // せっかちな子どもは空振りしてもすぐ次を叩く
    }
  } else if (hu.phase === 'recover') {
    if (hu.t >= hu.recover) { goPhase(hu, 'idle', 'calm'); hu.wait = Hc.idleWait; hu.target2 = -1; }
  }
  return ev;
}

// 振りかぶり開始からの「離す時刻」の帯（タイミングバー用。いまは非表示）。from＝これ以降に離すとギリギリ度が zoneNear 以上、to＝これを過ぎると叩かれる直前。total＝振りかぶり＋振り下ろし
function releaseZone(CFG, dur) {
  const total = (dur || CFG.human.windup) + CFG.human.strike, fallT = (1 - CFG.mole.hitH) / CFG.mole.fall;
  return { total, from: total - fallT - (1 - CFG.assist.zoneNear) * CFG.score.nearWindow, to: total - fallT - 0.02 };
}

// ---- 点数 ----
function whiffPoints(close, mult, CFG) { return Math.round((CFG.score.whiffBase + CFG.score.whiffNear * close * close) * mult); }
function whiffLabel(close) { return close >= 0.7 ? '紙一重！' : close >= 0.35 ? 'ギリギリ！' : 'スカッ'; }

// ---- ゲーム全体 ----
// opts：person＝人の id かその設定（なければ rng で 3人から選ぶ）、rng＝乱数（検証用に差し替え可）、noRage＝怒りを動かさない（検証用）
function newGame(CFG, opts) {
  opts = opts || {};
  const rng = opts.rng || Math.random;
  const person = typeof opts.person === 'object' ? opts.person : opts.person ? CFG.persons.find(p => p.id === opts.person) : pickPerson(rng, CFG);
  return { t: 0, rng, person, noRage: !!opts.noRage, mole: newMole(), human: newHuman(CFG, person), score: 0, bumps: 0, whiffs: 0, bestClose: 0, mult: 1, rage: 0, stage: 0, maxStage: 0, over: false, reason: '' };
}

// dt 秒進める。出来事（windup / strike / feint / whiff / stray / bump / stage / end）を配列で返す
function stepGame(g, dt, press, CFG) {
  const ev = [];
  if (g.over) return ev;
  g.t += dt;
  const m = g.mole, R = CFG.rage, P = g.person;
  moleStep(m, dt, press, g.t, CFG);
  if (m.stun <= 0 && m.h >= CFG.score.scoreH) g.score += CFG.score.pps * g.mult * dt;
  for (const e of humanStep(g.human, dt, m, g.t, CFG, { stage: g.stage, rng: g.rng })) {
    ev.push(e);
    if (e.type !== 'impact') continue;
    if (e.hit) {
      g.bumps++; m.stun = CFG.mole.stunTime; m.hitT = 0;
      if (!g.noRage) g.rage *= P.hitKeep;                                    // 叩くとすっきりする（時間ではさめない。叩いたときだけ下がる）
      ev.push({ type: 'bump', bumps: g.bumps, hole: e.hole });
    } else if (e.empty) {
      ev.push({ type: 'flail', hole: e.hole });                              // 連打の素振り（避けたわけではないので点も怒りもなし）
    } else if (e.stray) {
      ev.push({ type: 'stray', hole: e.hole });                              // 隣を叩いてしまった（避けたわけではないので点も怒りもなし）
    } else {
      const pts = whiffPoints(e.close, g.mult, CFG);
      g.score += pts; g.whiffs++; g.bestClose = Math.max(g.bestClose, e.close);
      if (!g.noRage) g.rage = Math.min(R.max, g.rage + (R.whiffBase + R.whiffNear * e.close) * P.rageUp);
      ev.push({ type: 'whiff', close: e.close, gap: e.gap, pts, hole: e.hole, label: whiffLabel(e.close) });
    }
  }
  const st = stageOf(g.rage, CFG);
  if (st !== g.stage) { ev.push({ type: 'stage', stage: st, from: g.stage }); g.stage = st; g.mult = st + 1; g.maxStage = Math.max(g.maxStage, st); }
  if (g.bumps >= CFG.maxBumps) { g.over = true; g.reason = 'bumped'; ev.push({ type: 'end', reason: g.reason }); }
  else if (g.t >= CFG.duration) { g.over = true; g.reason = 'escaped'; ev.push({ type: 'end', reason: g.reason }); }
  return ev;
}

// ---- 演出の時間割（開始・退場）。three.js なしで決める ----
const INTRO_DUR = 3.2, OUTRO_DUR = 2.8;

// 開始：暗い地下から穴をのぞく → 人間が左から歩いてくる → コインを入れる → ハンマーを構えてにらむ
function introState(t) {
  const walkU = clamp((t - 0.3) / 1.4, 0, 1);
  return {
    x: -9 * (1 - easeOut(walkU)), walking: t >= 0.3 && t < 1.7,
    moleH: easeOut(clamp(t / 0.9, 0, 1)) * 0.9,          // モグラがそっと顔を出す
    camU: easeOut(clamp(t / 1.0, 0, 1)),                   // カメラが地下から目の高さへ上がる
    irisU: easeOut(clamp(t / 1.1, 0, 1)),                  // 穴の光が広がる
    coinU: t >= 1.7 && t < 2.3 ? (t - 1.7) / 0.6 : -1,     // コインが飛ぶ（-1＝飛んでいない）
    hoverU: easeOut(clamp((t - 2.1) / 0.5, 0, 1)),         // ハンマーを穴の上に構える
    mood: t < 2.1 ? 'calm' : 'aim',
  };
}

// 退場：逃げきり＝ハンマーを台に置いて、肩を落としてとぼとぼ去る（全員共通）／叩かれて終わり＝ガッツポーズして満足げに去る
function outroState(t, reason) {
  const esc = reason === 'escaped', leaveFrom = esc ? 1.3 : 1.0, walkU = clamp((t - leaveFrom) / 1.5, 0, 1);
  return {
    x: 9 * walkU * walkU, walking: walkU > 0 && walkU < 1,
    downU: esc ? easeOut(clamp(t / 0.7, 0, 1)) : 0,                                     // ハンマーを台に置く
    slumpU: esc ? easeOut(clamp((t - 0.6) / 0.6, 0, 1)) : 0,                            // 肩を落とす
    fistU: esc ? 0 : easeOut(clamp(t / 0.25, 0, 1)) * (1 - clamp((t - 0.8) / 0.3, 0, 1)),   // ガッツポーズ
    mood: esc ? (t < 0.6 ? 'calm' : 'sad') : 'happy',
    moleH: esc ? easeOut(clamp((t - 0.5) / 0.4, 0, 1)) : null,                          // 逃げきったモグラがぴょこっと出る
  };
}

// ---- 3人の難しさ・エスカレートの手応え（同じ操作の人を各 3人にぶつける） ----
(() => {
  const ids = ['kid', 'uncle', 'granny'];

    const out = { score: [], bumps: [], stage: [], escaped: [] };
    for (let s = 1; s <= n; s++) {
      const r = runG({ person: PERS(id), rng: seeded(s * 7919 + 13) }, skilled(margin, PERS(id).ambush > 0 || PERS(id).flail > 0, JIT, s), 61);
      out.score.push(r.g.score); out.bumps.push(r.g.bumps); out.stage.push(r.g.maxStage); out.escaped.push(r.g.reason === 'escaped' ? 1 : 0);
    }
    return out;
  }
  const N = 16, skillT = {}, carefulT = {};
  for (const id of ids) { skillT[id] = trial(id, GREEDY, N); carefulT[id] = trial(id, SAFE, N); }
  for (const id of ids) info(PERS(id).name + '（ギリギリ狙い＝' + GREEDY + ' 秒前に引っ込む・ばらつき ±' + JIT + '）', '平均 ' + Math.round(mean(skillT[id].score)) + ' 点／最高段階 ' + mean(skillT[id].stage).toFixed(1) + '／叩かれた回数 ' + mean(skillT[id].bumps).toFixed(2) + '／逃げきり ' + Math.round(mean(skillT[id].escaped) * 100) + '%');
  for (const id of ids) info(PERS(id).name + '（慎重＝' + SAFE + ' 秒前に引っ込む）', '平均 ' + Math.round(mean(carefulT[id].score)) + ' 点／最高段階 ' + mean(carefulT[id].stage).toFixed(1) + '／逃げきり ' + Math.round(mean(carefulT[id].escaped) * 100) + '%');
  const means = ids.map(id => mean(skillT[id].score));
  check('3人の難しさがそろっている（同じ操作で点の平均が 1.6 倍以内。子どもは攻撃が多い高リスク・高得点）', Math.max(...means) / Math.min(...means) <= 1.6, means.map(Math.round).join(' / '));
  check('ギリギリ狙いの操作（ミスは ±0.125 秒のばらつき）でも、誰が相手でも 6 割以上は逃げきれる', ids.every(id => mean(skillT[id].escaped) >= 0.6), ids.map(id => mean(skillT[id].escaped).toFixed(2)).join(' / '));
  check('ギリギリを狙う人ほど、怒りの段階が上がる（誰が相手でも）', ids.every(id => mean(skillT[id].stage) > mean(carefulT[id].stage) + 0.5), ids.map(id => mean(skillT[id].stage).toFixed(1) + ' vs ' + mean(carefulT[id].stage).toFixed(1)).join(' / '));
  check('ギリギリを狙う方が、慎重より点が高い（欲張りが報われる）', ids.every(id => mean(skillT[id].score) > mean(carefulT[id].score) * 1.15), ids.map(id => Math.round(mean(skillT[id].score)) + ' vs ' + Math.round(mean(carefulT[id].score))).join(' / '));
  check('上手な操作なら、誰が相手でも「激怒」以上まで怒らせられる（平均で段階 3 以上）', ids.every(id => mean(skillT[id].stage) >= 3), ids.map(id => mean(skillT[id].stage).toFixed(1)).join(' / '));

  const R = { name: '負けず嫌いのおじさん', score: 12345, maxStage: 3, reason: 'escaped' };
  const tx = shareText(R, CFG);
  check('共有文：相手・最高段階・点・逃げきり・ハッシュタグが入る', tx.includes('負けず嫌いのおじさん') && tx.includes('「激怒」') && tx.includes('12345点') && tx.includes('逃げきり') && tx.includes('#' + CFG.share.hashtag), tx);
  check('共有文：叩かれて終わりなら「逃げきり」を付けない', !shareText({ name: '子ども', score: 10, maxStage: 1, reason: 'bumped' }, CFG).includes('逃げきり'));
  check('共有文：最後まで平静なら「怒らせた」ではなく挑戦', !shareText({ name: '子ども', score: 10, maxStage: 0, reason: 'escaped' }, CFG).includes('怒らせた') && shareText({ name: '子ども', score: 10, maxStage: 0, reason: 'escaped' }, CFG).includes('挑戦'));
  check('共有：X の投稿画面の URL（文章と URL をエンコード）', (() => { const u = tweetUrl('あ b', 'https://x.test/p?q=1'); return u.startsWith('https://twitter.com/intent/tweet?text=') && u.includes(encodeURIComponent('あ b')) && u.includes('&url=' + encodeURIComponent('https://x.test/p?q=1')); })());
  check('共有：公開先 URL が設定されている', /^https:\/\/.+\/$/.test(CFG.share.url));
  check('全段階に名前がある（結果・共有に使う）', CFG.stages.every(s => typeof s.name === 'string' && s.name.length > 0));
})();
const sumEl = document.getElementById('sum');
sumEl.textContent = nNg === 0 ? ('全 ' + nOk + ' 件 PASS') : (nNg + ' 件 FAIL / ' + (nOk + nNg) + ' 件');
sumEl.style.color = nNg === 0 ? '#6bd07a' : '#ff6b6b';
</script>
