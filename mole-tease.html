<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>叩かれないモグラ</title>
<style>
  :root{--u:3.75px;--ink:#2b2433;--bg:#4a2f6b;--jp:"Hiragino Kaku Gothic ProN","Yu Gothic","YuGothic","Meiryo","Noto Sans JP",sans-serif}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:#141018;color:var(--ink);font-family:var(--jp);touch-action:none;user-select:none;-webkit-user-select:none;overscroll-behavior:none;-webkit-touch-callout:none}
  html,body{height:100vh;height:100dvh}
  body{word-break:auto-phrase;overflow-wrap:anywhere;line-break:strict}
  p,h1,h2{text-wrap:balance}
  button{font-family:var(--jp);touch-action:manipulation;cursor:pointer}
  .nw{white-space:nowrap}
  .ph{display:inline-block}

  #stage{position:fixed;top:0;height:100vh;left:50%;transform:translateX(-50%);width:min(100vw,56.25vh);overflow:hidden;background:var(--bg);box-shadow:0 0 0 1px rgba(255,255,255,.08),0 0 60px rgba(0,0,0,.7);touch-action:none}
  @supports (height:100dvh){#stage{height:100dvh;width:min(100vw,56.25dvh)}}
  #view{position:absolute;inset:0;overflow:hidden}
  #view canvas{display:block;width:100%;height:100%}

  #hud{position:absolute;left:0;right:0;top:0;z-index:5;pointer-events:none;padding:calc(env(safe-area-inset-top) + var(--u)*2.5) calc(var(--u)*3) 0;opacity:0;transition:opacity .25s}
  #hud.on{opacity:1}
  .row{display:flex;gap:calc(var(--u)*2);align-items:stretch}
  .chip{display:flex;align-items:center;justify-content:center;gap:calc(var(--u)*1.4);padding:0 calc(var(--u)*3);height:calc(var(--u)*10);border-radius:calc(var(--u)*3);background:rgba(255,255,255,.9);box-shadow:0 2px 0 rgba(0,0,0,.2);font-weight:900;line-height:1.1;white-space:nowrap}
  .chip small{font-size:calc(var(--u)*2.8);letter-spacing:.1em;opacity:.65;font-weight:700}
  .chip b{font-size:calc(var(--u)*6.5);font-variant-numeric:tabular-nums}
  #scoreBox{flex:1.5} #scoreBox b{color:#e8590c}
  #timeBox{flex:1}
  #timeBox.low b{color:#e03131}
  #multBox{flex:.8;padding:0 calc(var(--u)*2)} #multBox b{font-size:calc(var(--u)*6.5)}
  #multBox.m1{background:#fff3bf} #multBox.m2{background:#ffd8a8} #multBox.m3{background:#ffa8a8} #multBox.m4{background:#ff8787;color:#fff} #multBox.m5{background:#e03131;color:#fff;animation:glowHue 1s linear infinite}
  #multBox.bump{animation:bump .35s ease-out}
  @keyframes glowHue{0%{filter:hue-rotate(0)}100%{filter:hue-rotate(30deg)}}
  #bumpBox{flex:1.1}
  #who{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top) + var(--u)*22);z-index:5;pointer-events:none;text-align:center;opacity:0;transition:opacity .4s}
  #who.on{opacity:1}
  #who span{display:inline-block;padding:calc(var(--u)*1) calc(var(--u)*4);border-radius:calc(var(--u)*4);background:rgba(20,16,24,.7);color:#fff;font-size:calc(var(--u)*4);font-weight:900;white-space:nowrap}
  .lump{display:inline-block;width:calc(var(--u)*5.4);height:calc(var(--u)*5.4);border-radius:50%;background:#e9ecef;border:calc(var(--u)*.6) solid #adb5bd}
  .lump.on{background:#ff8787;border-color:#e03131}
  #scoreBox.bump{animation:bump .3s ease-out}
  @keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.2)}100%{transform:scale(1)}}

  #iris{position:absolute;inset:0;z-index:4;pointer-events:none;opacity:0;--r:0%;background:radial-gradient(circle at 50% 42%,rgba(0,0,0,0) 0,rgba(0,0,0,0) var(--r),rgba(4,2,8,.97) calc(var(--r) + 16%))}
  #skip{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + var(--u)*8);z-index:5;pointer-events:none;text-align:center;color:rgba(255,255,255,.75);font-size:calc(var(--u)*3.6);font-weight:700;text-shadow:0 1px 4px rgba(0,0,0,.8);display:none}
  #skip.on{display:block}
  #soundBtn{position:absolute;right:calc(var(--u)*3);bottom:calc(env(safe-area-inset-bottom) + var(--u)*3);z-index:12;width:calc(var(--u)*9);height:calc(var(--u)*9);border:0;border-radius:50%;background:rgba(255,255,255,.88);box-shadow:0 2px 0 rgba(0,0,0,.25);font-size:calc(var(--u)*4.4);font-weight:900;color:var(--ink);pointer-events:auto}
  #soundBtn.off{opacity:.5}
  #sflash{position:absolute;inset:0;z-index:4;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 50%,rgba(255,255,255,0) 28%,var(--sc,#ff922b) 100%)}
  #sflash.on{animation:sflash .75s ease-out}
  @keyframes sflash{0%{opacity:1}100%{opacity:0}}
  #flash{position:absolute;inset:0;z-index:4;pointer-events:none;background:radial-gradient(circle,rgba(255,255,255,.9),rgba(255,70,70,.8));opacity:0}
  #flash.on{animation:flash .45s ease-out}
  @keyframes flash{0%{opacity:.95}100%{opacity:0}}
  #mini{position:absolute;left:calc(var(--u)*3);bottom:calc(env(safe-area-inset-bottom) + var(--u)*3);z-index:5;pointer-events:none;display:grid;grid-template-columns:repeat(3,calc(var(--u)*4.4));gap:calc(var(--u)*1);padding:calc(var(--u)*1.6);border-radius:calc(var(--u)*2);background:rgba(20,16,24,.55);opacity:0;transition:opacity .2s}
  #mini.on{opacity:1}
  #mini i{display:block;height:calc(var(--u)*4.4);border-radius:50%;background:rgba(255,255,255,.25)}
  #mini i.me{background:#ffd43b;box-shadow:0 0 calc(var(--u)*2) #ffd43b} #mini i.rc{background:#ff922b} #mini i.tg{background:#ff3b30}
  #tunnel{position:absolute;inset:0;z-index:3;pointer-events:none;background:radial-gradient(ellipse at 50% 55%,rgba(0,0,0,0) 52%,rgba(34,18,12,.55) 82%,rgba(20,10,6,.92) 100%);opacity:0}
  #danger{position:absolute;inset:0;z-index:4;pointer-events:none;box-shadow:inset 0 0 calc(var(--u)*26) calc(var(--u)*7) rgba(255,40,40,.95);opacity:0}
  #clock{position:absolute;left:calc(var(--u)*9);right:calc(var(--u)*9);top:calc(env(safe-area-inset-top) + var(--u)*15.5);height:calc(var(--u)*4.6);z-index:5;pointer-events:none;border-radius:calc(var(--u)*2.3);background:rgba(20,16,24,.72);box-shadow:0 2px 0 rgba(0,0,0,.25);overflow:hidden;opacity:0;transition:opacity .12s}
  #clock.on{opacity:1}
  #clockZone{position:absolute;top:0;bottom:0;background:linear-gradient(90deg,#ffe066,#ff922b 60%,#ff3b30)}
  #clockFill{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(255,255,255,.42);border-right:calc(var(--u)*1.4) solid #fff;box-shadow:0 0 calc(var(--u)*2) #fff}
  #clockLab{position:absolute;left:0;right:0;top:calc(var(--u)*21.5);text-align:center;font-size:calc(var(--u)*3.4);font-weight:900;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.8);opacity:0;z-index:5;pointer-events:none;transition:opacity .12s}
  #clockLab.on{opacity:.95}
  #rage{position:relative;margin-top:calc(var(--u)*2);height:calc(var(--u)*5);border-radius:calc(var(--u)*2.5);background:rgba(20,16,24,.72);box-shadow:0 2px 0 rgba(0,0,0,.25);overflow:hidden}
  #rageFill{position:absolute;left:0;top:0;bottom:0;width:0;background:#74c0fc;transition:width .25s ease-out,background .3s}
  #rage.r1 #rageFill{background:#ffd43b} #rage.r2 #rageFill{background:#ff922b} #rage.r3 #rageFill{background:#ff6b6b} #rage.r4 #rageFill{background:#e64980;animation:glowHue 1s linear infinite}
  #rage i{position:absolute;top:0;bottom:0;width:calc(var(--u)*.5);margin-left:calc(var(--u)*-.25);background:rgba(255,255,255,.7)}
  #rageLab,#rageName{position:absolute;top:0;bottom:0;display:flex;align-items:center;font-size:calc(var(--u)*3);font-weight:900;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.9);white-space:nowrap}
  #rageLab{left:calc(var(--u)*2.4);letter-spacing:.1em} #rageName{right:calc(var(--u)*2.4);font-size:calc(var(--u)*3.6)}
  #rageName.bump{animation:bump .35s ease-out}
  #rage.up{animation:rageUp .6s ease-out} #rage.down{animation:rageDown .5s ease-out}
  @keyframes rageUp{0%{transform:scale(1);box-shadow:0 0 0 0 rgba(255,255,255,.95)}30%{transform:scale(1.07);box-shadow:0 0 calc(var(--u)*4) calc(var(--u)*1.5) rgba(255,255,255,.95);filter:brightness(1.7)}100%{transform:scale(1);box-shadow:0 0 0 0 rgba(255,255,255,0)}}
  @keyframes rageDown{0%{filter:brightness(.6)}100%{filter:brightness(1)}}
  #pops{position:absolute;left:50%;top:38%;z-index:6;pointer-events:none}
  .pop{position:absolute;left:0;transform:translateX(-50%);font-size:calc(var(--u)*11);font-weight:900;white-space:nowrap;-webkit-text-stroke:calc(var(--u)*.8) #fff;paint-order:stroke fill;animation:floatUp 1.1s ease-out forwards}
  .pop small{display:block;text-align:center;font-size:.6em}
  #popsStage{position:absolute;left:50%;top:21%;z-index:6;pointer-events:none}
  .pop.rage{color:#e03131;font-size:calc(var(--u)*9)} .pop.cool{color:#1c7ed6;font-size:calc(var(--u)*7.5)} .pop.near{color:#e8590c;font-size:calc(var(--u)*13)} .pop.great{color:#d6336c;font-size:calc(var(--u)*15)} .pop.miss{color:#7048e8;font-size:calc(var(--u)*9)} .pop.bad{color:#e03131}
  @keyframes floatUp{0%{opacity:0;margin-top:calc(var(--u)*3);scale:.6}15%{opacity:1;scale:1.15}30%{scale:1}100%{opacity:0;margin-top:calc(var(--u)*-16)}}

  #hint{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + var(--u)*8);z-index:5;pointer-events:none;text-align:center;color:#fff;font-size:calc(var(--u)*4.6);font-weight:900;text-shadow:0 2px 6px rgba(0,0,0,.8);opacity:0;transition:opacity .3s;line-height:1.5}
  #hint.on{opacity:1}

  .screen{position:absolute;inset:0;z-index:10;display:none;flex-direction:column;align-items:center;justify-content:safe center;gap:calc(var(--u)*4);padding:calc(var(--u)*8);background:rgba(20,14,30,.72);color:#fff;text-align:center;overflow:auto}
  .screen.on{display:flex}
  .screen h1{font-size:calc(var(--u)*11);font-weight:900;line-height:1.25;text-shadow:0 3px 0 rgba(0,0,0,.4)}
  .screen h2{font-size:calc(var(--u)*8);font-weight:900}
  .screen p{font-size:calc(var(--u)*4.4);line-height:1.7;font-weight:700}
  #overNew{display:none;padding:calc(var(--u)*1) calc(var(--u)*5);border-radius:calc(var(--u)*5);background:#ff6b6b;color:#fff;font-weight:900;font-size:calc(var(--u)*5);animation:bump .5s ease-out}
  #overNew.on{display:block}
  .sbtn{border:1px solid rgba(255,255,255,.45);background:transparent;color:#fff;border-radius:calc(var(--u)*4);padding:calc(var(--u)*1.8) calc(var(--u)*6);font-size:calc(var(--u)*3.8);font-weight:700}
  .sbtn:active{background:rgba(255,255,255,.15)}
  .big .unit{font-size:.32em;color:#fff;margin-left:.12em}
  .big{font-size:calc(var(--u)*22);font-weight:900;color:#ffd43b;line-height:1;font-variant-numeric:tabular-nums}
  .btn{border:0;border-radius:calc(var(--u)*5);padding:calc(var(--u)*3.4) calc(var(--u)*10);font-size:calc(var(--u)*6);font-weight:900;background:#ffd43b;color:#3b2a00;box-shadow:0 calc(var(--u)*1) 0 #c99a00}
  .btn:active{transform:translateY(2px);box-shadow:0 calc(var(--u)*.4) 0 #c99a00}
</style>
</head>
<body>
<div id="stage">
  <div id="view"></div>
  <div id="hud">
    <div class="row">
      <div class="chip" id="scoreBox"><b id="score">0</b><small>点</small></div>
      <div class="chip" id="timeBox"><small>残り</small><b id="time">60</b></div>
      <div class="chip" id="multBox"><b id="mult">×1</b></div>
      <div class="chip" id="bumpBox"><span class="lump" id="lump0"></span><span class="lump" id="lump1"></span><span class="lump" id="lump2"></span></div>
    </div>
    <div id="rage"><i style="left:18%"></i><i style="left:42%"></i><i style="left:68%"></i><i style="left:88%"></i><div id="rageFill"></div><span id="rageLab">怒り</span><span id="rageName">平静</span></div>
  </div>
  <div id="tunnel"></div><div id="danger"></div>
  <div id="iris"></div><div id="sflash"></div><div id="flash"></div>
  <div id="clock"><div id="clockZone"></div><div id="clockFill"></div></div>
  <div id="clockLab"><span class="ph">黄色いところで</span><span class="ph">離すと紙一重</span></div>
  <div id="mini"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <div id="pops"></div><div id="popsStage"></div>
  <div id="who"><span id="whoName"></span></div>
  <div id="skip">タップでスキップ</div>
  <button class="ibtn" id="soundBtn" title="音の入り切り">♪</button>
  <div id="hint"><span class="ph">押している間だけ</span><span class="ph">顔を出す</span><br><span class="ph">ハンマーが来る前に</span><span class="ph">離せ</span></div>

  <div class="screen on" id="titleScr">
    <h1><span class="ph">叩かれない</span><span class="ph">モグラ</span></h1>
    <p><span class="ph">モグラ叩きを、</span><span class="ph">モグラ側で。</span><br><span class="ph">ギリギリで引っ込んで、</span><span class="ph">人間をムキにさせろ。</span></p>
    <p class="nw">自己ベスト <b id="titleBest">0</b> 点</p>
    <button class="btn" id="startBtn">はじめる</button>
  </div>
  <div class="screen" id="pauseScr">
    <h2>一時停止</h2>
    <button class="btn" id="resumeBtn">つづける</button>
  </div>
  <div class="screen" id="overScr">
    <h2 id="overTitle">逃げきり！</h2>
    <div class="big nw"><span id="overScore">0</span><small class="unit">点</small></div>
    <div id="overNew">新記録！</div>
    <p id="overWho"></p>
    <p class="nw" id="overStat"></p>
    <p class="nw" id="overBest"></p>
    <button class="btn" id="againBtn">もう一回</button>
    <button class="sbtn" id="shareBtn">Xで共有</button>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
"use strict";
// ===== 調整用の数値（遊んで直す） =====
// 穴は 3×3。行 0＝奥（人間に近い）、行 2＝手前（こちらに近い）。座標の単位はおもちゃの台の「メートルもどき」
const CFG = {
  duration: 60,           // 逃げきりまでの秒数
  maxBumps: 3,            // たんこぶがこの数で終わり
  holes: { dx: 1.8, dz: 2.1, z0: -2.1, r: 0.8 },   // 穴の間隔（横・奥行き）、いちばん奥の行の z、穴の半径
  mole: {
    rise: 7.5,            // 出る速さ（高さ 0〜1 を毎秒）
    fall: 9,              // 引っ込む速さ
    moveTime: 0.2,        // 別の穴へ地下を移る時間
    hitH: 0.3,            // この高さより上に出ていたら叩かれる
    exposeH: 0.5,         // この高さ以上で「顔を出している」＝人間に見つかる・点が入る
    flatH: 0.4,           // 叩かれてつぶれた高さ
    flatTime: 0.35,       // つぶれたままの時間
    stunTime: 0.9,        // 叩かれてから出られない時間
  },
  human: {
    firstWait: 1.6,       // 開始してから最初に狙うまでの待ち

    windup: 0.70,         // 振りかぶり（予告）の長さ
    strike: 0.12,         // 振り下ろしの長さ
    recoverMiss: 0.55,    // 空振り後に次を狙えるまで
    recoverHit: 1.0,      // 当てたあと
    idleWait: 0.15,       // 次を狙う前のひと呼吸
    minWindup: 0.45,      // 怒りで速くなっても、振りかぶりはこれ未満にしない（見てから避けられる下限）
    feintAt: 0.8,         // フェイントは振りかぶりのこの割合で止めて引く（ハンマーを上げきらない）
    recoverFeint: 0.6,    // フェイントのあと次を狙えるまで（途中まで振り下ろして止め、にやりと笑う間）
    recoverStray: 0.8,    // 隣を叩いてしまったあと（ぽかんとする間）
    flailWindup: 0.4,     // 連打（せっかちな子ども）の振りかぶり。モグラが出ていないときに始まる素振りなので、反応時間の下限は考えない
    ambushWindup: 0.5,    // 待ち伏せ中に同じ穴から出たときの、素早い振りかぶり
    ambushReaction: 0.12, // 待ち伏せ中に気づくまで
    recoverAmbush: 0.25,  // 待ち伏せをあきらめたあと
  },
  // 怒り（0〜max）：空振りで上がる（ギリギリなほど大きく）、時間でさめる、叩くと少し下がる。段階は th 以上で上がり、点の倍率＝段階（×1〜×5）
  rage: { max: 100, whiffBase: 0.5, whiffNear: 6.5 },   // 時間ではさめない。叩かれたら persons の hitKeep 倍に下がる（0＝リセット）
  stages: [
    { name: '平静', th: 0,  windupMul: 1.0,  feint: 0,    reach: 0, hammers: 1, scale: 1 },
    { name: 'むっ', th: 18, windupMul: 0.88, feint: 0,    reach: 0, hammers: 1, scale: 1 },
    { name: 'ムキ', th: 42, windupMul: 0.8,  feint: 0.18, reach: 0, hammers: 1, scale: 1.1 },
    { name: '激怒', th: 68, windupMul: 0.75, feint: 0.18, reach: 1, hammers: 1, scale: 1.7 },   // 巨大ハンマー：左右の隣の穴まで届く
    { name: '錯乱', th: 88, windupMul: 0.75, feint: 0.22, reach: 1, hammers: 2, scale: 1.7 },   // 2本同時
  ],
  // 叩く人 3人（毎回ランダムに 1人）。windupMul＝振りかぶりの長さの倍率、reaction＝気づくまで、missMul＝空振り後の立ち直りの倍率（小さいほどすぐ次を叩く）、flail＝空振りのあと、同じ穴を続けて振る回数（連打。使っていない。待ち時間でテンポが悪くなるので子どもからは外した。検証用に残してある）、feint＝フェイント率、ambush＝待ち伏せの秒数、rageUp＝怒りの上がりやすさ、hitKeep＝叩いたあとに残る怒りの割合（0＝すっきりリセット）
  // stray＝隣の穴を叩く率（使っていない。バグに見えるので子どもの癖としては外した。検証用に残してある）
  persons: [
    { id: 'kid',    name: 'せっかちな子ども',     windupMul: 0.62, reaction: 0.30, stray: 0, missMul: 0.85, flail: 0, feint: 0,    ambush: 0,   rageUp: 0.95,  hitKeep: 0 },
    { id: 'uncle',  name: '負けず嫌いのおじさん', windupMul: 1.0,  reaction: 0.30, stray: 0, missMul: 1,   flail: 0, feint: 0.22, ambush: 0,   rageUp: 1.0,  hitKeep: 0.4 },
    { id: 'granny', name: '正確なおばあちゃん',   windupMul: 1.1,  reaction: 0.30, stray: 0, missMul: 1,   flail: 0, feint: 0,    ambush: 1.3, rageUp: 1.35, hitKeep: 0 },
  ],
  score: {
    pps: 100,             // 顔を出している間の毎秒の点
    whiffBase: 50,        // 空振りさせたときの基本点
    whiffNear: 450,       // ギリギリなほど足される点（closeness の2乗で効く）
    nearWindow: 0.30,     // 人間が叩く直前、何秒以内に引っ込んだらギリギリとみなすか
    scoreH: 0.5,          // この高さ以上で点が入る
  },
  // カメラ：モグラの目の高さ。台の手前の端から奥の人間を見上げる／少し見下ろす
  cam: { pos: [0, 6.0, 7.2], look: [0, 2.4, -1.6], hfov: 48 },
  // X 共有（url は公開先。空ならいま開いているページ）
  share: { hashtag: '叩かれないモグラ', url: 'https://fish-suika.github.io/mole-tease/' },
  // タイミングバー（振りかぶりの間だけ出る補助）。zoneFrom＝ここから先で離すと「ギリギリ」（ギリギリ度の下限）、assist＝false で非表示
  assist: { bar: false, zoneNear: 0.35 },
  // 一人称視点（モグラが出ている間だけカメラがモグラの目の位置へ降りる）。既定は amt＝0（ずっと俯瞰）、URL に ?view=fps を付けたときだけ amt＝1 で有効
  // eyeBase＋eyeK×高さ＝目の高さ、back＝穴の中心より後ろへ、pitch＝見上げる角度（度）、windupPitch＝振りかぶりのあいだ頭上のハンマーを見上げる分（度）、hideAt＝この寄り具合を超えたらモグラの体を隠す（鼻と手だけ残す）
  fps: { amt: 0, eyeBase: 0.08, eyeK: 0.92, back: 0.45, pitch: 11, lookDist: 10, lookXk: 0.25, rate: 9, hideAt: 0.35, fov: 84, windupPitch: 42, tiltRate: 6 },
};
// 視点スイッチ：既定は俯瞰。URL の末尾に ?view=fps を付けると一人称視点が有効になる（?view=top は既定と同じ俯瞰）
try { if (new URLSearchParams(location.search).get('view') === 'fps') CFG.fps.amt = 1; } catch (e) {}
// ===== 判定・点数・人間の動き（three.js を使わない純粋ロジック） =====
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const easeOut = t => 1 - Math.pow(1 - t, 3);

// 穴 i（0〜8）の台上の位置。行 0＝奥、行 2＝手前
function holePos(i, CFG) {
  const H = CFG.holes;
  return { x: (i % 3 - 1) * H.dx, z: H.z0 + Math.floor(i / 3) * H.dz };
}
const rowOf = i => Math.floor(i / 3), colOf = i => i % 3;

// 画面の座標（px）から押している穴を決める。cur＝今押している穴、hyst＝今の穴を離れにくくする倍率
function pickHole(px, py, pts, cur, hyst) {
  let best = -1, bd = Infinity;
  for (let i = 0; i < pts.length; i++) {
    const d = Math.hypot(pts[i].x - px, pts[i].y - py);
    if (d < bd) { bd = d; best = i; }
  }
  if (cur >= 0 && cur < pts.length && cur !== best) {
    const dc = Math.hypot(pts[cur].x - px, pts[cur].y - py);
    if (dc <= bd * (hyst || 1.25)) return cur;
  }
  return best;
}

// ---- モグラ ----
function newMole() {
  return { hole: 4, h: 0, dest: -1, travel: 0, stun: 0, hitT: 99, upSince: -1, exitTs: new Array(9).fill(-99) };
}

// press＝押している穴（なければ -1）、now＝ゲーム内の経過秒
function moleStep(m, dt, press, now, CFG) {
  const M = CFG.mole;
  const hPrev = m.h;
  m.hitT += dt;
  if (m.stun > 0) {
    m.stun = Math.max(0, m.stun - dt);
    m.travel = 0; m.dest = -1;
    if (m.stun > M.stunTime - M.flatTime) m.h = M.flatH;
    else m.h = Math.max(0, m.h - M.fall * dt);
  } else if (press >= 0 && press !== m.hole) {
    // 別の穴へ：いまの穴で引っ込み、地下を移ってから出る
    if (m.h > 0) m.h = Math.max(0, m.h - M.fall * dt);
    else {
      if (m.dest !== press) { m.dest = press; m.travel = M.moveTime; }
      m.travel -= dt;
      if (m.travel <= 0) { m.hole = m.dest; m.dest = -1; m.travel = 0; }
    }
  } else if (press === m.hole) {
    m.dest = -1; m.travel = 0;
    m.h = Math.min(1, m.h + M.rise * dt);
  } else {
    m.dest = -1; m.travel = 0;
    m.h = Math.max(0, m.h - M.fall * dt);
  }
  if (hPrev > M.hitH && m.h <= M.hitH) m.exitTs[m.hole] = now;     // 叩かれる高さを離れた時刻（ギリギリ度に使う）
  if (m.h >= M.exposeH && m.stun <= 0) { if (m.upSince < 0) m.upSince = now; } else m.upSince = -1;
}

function isHittable(m, CFG) { return m.stun <= 0 && m.travel === 0 && m.h > CFG.mole.hitH; }

// ---- 人間（3人の癖・怒りの段階つき） ----
function pickPerson(rng, CFG) { return CFG.persons[Math.min(CFG.persons.length - 1, Math.floor(rng() * CFG.persons.length))]; }
function stageOf(rage, CFG) { let s = 0; for (let i = 0; i < CFG.stages.length; i++) if (rage >= CFG.stages[i].th) s = i; return s; }
// 振りかぶりの長さ：人の癖 × 怒りの段階。短くしすぎない（見てから避けられる下限 minWindup）
function windupDur(P, S, CFG) { return Math.max(CFG.human.minWindup, CFG.human.windup * P.windupMul * S.windupMul); }

function newHuman(CFG, person) {
  // seq＝フェーズが変わるたびに増える（見た目の切り替え用）。target2＝2本目のハンマーの穴（怒り最大のとき）
  return { person, phase: 'idle', t: 0, seq: 0, wait: CFG.human.firstWait, target: -1, target2: -1, dur: 0, stage: 0, feint: false, strayed: false, lastStray: false, flail: false, flailLeft: 0, sawMole: false, recover: 0, mood: 'calm' };
}

// 振りかぶりを始める。mode：true＝待ち伏せからの素早い振りかぶり、'flail'＝連打（空振りのあと続けて振る）
function startWindup(hu, hole, mode, ctx, CFG) {
  const P = hu.person, S = CFG.stages[ctx.stage], flail = mode === 'flail', ambush = mode === true;
  hu.phase = 'windup'; hu.t = 0; hu.seq++; hu.mood = 'aim'; hu.stage = ctx.stage;
  hu.target = hole; hu.strayed = false; hu.feint = false; hu.target2 = -1; hu.flail = flail; hu.sawMole = false;
  if (!ambush && !flail) {
    // 雑：ときどき隣（左右）の穴を狙ってしまう。続けては起こさない（バグに見えるので）
    if (P.stray > 0 && !hu.lastStray && ctx.rng() < P.stray) {
      const c = colOf(hole), opts = []; if (c > 0) opts.push(hole - 1); if (c < 2) opts.push(hole + 1);
      hu.target = opts[Math.min(opts.length - 1, Math.floor(ctx.rng() * opts.length))]; hu.strayed = true;
    }
    hu.feint = ctx.rng() < clamp(P.feint + S.feint, 0, 0.6);
  }
  hu.lastStray = hu.strayed;
  hu.dur = flail ? CFG.human.flailWindup : ambush ? CFG.human.ambushWindup : windupDur(P, S, CFG);
  if (S.hammers >= 2 && !hu.feint && !flail) {                       // 2本目：ちがう行のどこか（行を変えるだけでは逃げきれない）
    const r2 = (rowOf(hu.target) + 1 + Math.min(1, Math.floor(ctx.rng() * 2))) % 3;
    hu.target2 = r2 * 3 + Math.min(2, Math.floor(ctx.rng() * 3));
  }
  return { type: 'windup', hole: hu.target, hole2: hu.target2, dur: hu.dur, feint: hu.feint, stray: hu.strayed, ambush: ambush, flail };
}

function goPhase(hu, phase, mood) { hu.phase = phase; hu.t = 0; hu.seq++; if (mood) hu.mood = mood; }

// 人間の 1 コマ。出来事（windup / strike / feint / impact）を配列で返す。ctx＝{ stage, rng }
function humanStep(hu, dt, m, now, CFG, ctx) {
  const Hc = CFG.human, P = hu.person, ev = [];
  hu.t += dt;
  if (hu.flail && m.stun <= 0 && m.upSince >= 0 && m.hole === hu.target) hu.sawMole = true;   // 連打の最中にモグラが出てきたか（出てきたなら、避けたら普通の空振り扱い）
  if (hu.phase === 'idle') {
    hu.wait -= dt;
    if (hu.wait <= 0 && m.stun <= 0 && m.upSince >= 0 && now - m.upSince >= P.reaction) ev.push(startWindup(hu, m.hole, false, ctx, CFG));
  } else if (hu.phase === 'ambush') {
    // 待ち伏せ：空振りした穴の上でハンマーを構えたまま待つ。同じ穴から出直すと素早く叩く
    if (m.stun <= 0 && m.hole === hu.target && m.upSince >= 0 && now - m.upSince >= Hc.ambushReaction) ev.push(startWindup(hu, hu.target, true, ctx, CFG));
    else if (hu.t >= P.ambush) { goPhase(hu, 'recover', 'calm'); hu.recover = Hc.recoverAmbush; }
  } else if (hu.phase === 'windup') {
    if (hu.feint && hu.t >= hu.dur * Hc.feintAt) {         // フェイント：ハンマーを上げきらずに止めて、引く
      ev.push({ type: 'feint', hole: hu.target });
      goPhase(hu, 'recover', 'feint'); hu.recover = Hc.recoverFeint;
    } else if (hu.t >= hu.dur) { goPhase(hu, 'strike'); ev.push({ type: 'strike', hole: hu.target, hole2: hu.target2 }); }
  } else if (hu.phase === 'strike') {
    if (hu.t >= Hc.strike) {
      const S = CFG.stages[hu.stage];
      const cover = t => t >= 0 && rowOf(m.hole) === rowOf(t) && Math.abs(colOf(m.hole) - colOf(t)) <= S.reach;   // 巨大ハンマーは左右の隣の穴まで届く
      const hit = isHittable(m, CFG) && (cover(hu.target) || cover(hu.target2));
      const stray = !hit && hu.strayed && m.hole !== hu.target;
      const empty = !hit && hu.flail && !hu.sawMole;          // 連打の素振り（モグラがいなかった）：避けたことにならず、点も怒りもなし
      let gap = null, close = 0;
      if (!hit && !stray && !empty) {
        gap = Math.max(0, now - m.exitTs[hu.target]);
        close = clamp(1 - gap / CFG.score.nearWindow, 0, 1);
      }
      ev.push({ type: 'impact', hole: hu.target, hole2: hu.target2, hit, stray, empty, gap, close });
      if (hit) { hu.flailLeft = 0; goPhase(hu, 'recover', 'happy'); hu.recover = Hc.recoverHit; }
      else if (!stray && P.flail > 0 && (!empty || hu.flailLeft > 0)) {
        if (!empty) hu.flailLeft = P.flail;                   // 本物の空振りのあと、続けて振り回す
        if (hu.flailLeft > 0) { hu.flailLeft--; ev.push(startWindup(hu, hu.target, 'flail', ctx, CFG)); }
        else { goPhase(hu, 'recover', 'miss'); hu.recover = Hc.recoverMiss * (P.missMul || 1); }
      }
      else if (!stray && P.ambush > 0) goPhase(hu, 'ambush', 'aim');
      else if (stray) { goPhase(hu, 'recover', 'confuse'); hu.recover = Hc.recoverStray; }
      else { goPhase(hu, 'recover', 'miss'); hu.recover = Hc.recoverMiss * (P.missMul || 1); }   // せっかちな子どもは空振りしてもすぐ次を叩く
    }
  } else if (hu.phase === 'recover') {
    if (hu.t >= hu.recover) { goPhase(hu, 'idle', 'calm'); hu.wait = Hc.idleWait; hu.target2 = -1; }
  }
  return ev;
}

// 振りかぶり開始からの「離す時刻」の帯（タイミングバー用。いまは非表示）。from＝これ以降に離すとギリギリ度が zoneNear 以上、to＝これを過ぎると叩かれる直前。total＝振りかぶり＋振り下ろし
function releaseZone(CFG, dur) {
  const total = (dur || CFG.human.windup) + CFG.human.strike, fallT = (1 - CFG.mole.hitH) / CFG.mole.fall;
  return { total, from: total - fallT - (1 - CFG.assist.zoneNear) * CFG.score.nearWindow, to: total - fallT - 0.02 };
}

// ---- 点数 ----
function whiffPoints(close, mult, CFG) { return Math.round((CFG.score.whiffBase + CFG.score.whiffNear * close * close) * mult); }
function whiffLabel(close) { return close >= 0.7 ? '紙一重！' : close >= 0.35 ? 'ギリギリ！' : 'スカッ'; }

// ---- ゲーム全体 ----
// opts：person＝人の id かその設定（なければ rng で 3人から選ぶ）、rng＝乱数（検証用に差し替え可）、noRage＝怒りを動かさない（検証用）
function newGame(CFG, opts) {
  opts = opts || {};
  const rng = opts.rng || Math.random;
  const person = typeof opts.person === 'object' ? opts.person : opts.person ? CFG.persons.find(p => p.id === opts.person) : pickPerson(rng, CFG);
  return { t: 0, rng, person, noRage: !!opts.noRage, mole: newMole(), human: newHuman(CFG, person), score: 0, bumps: 0, whiffs: 0, bestClose: 0, mult: 1, rage: 0, stage: 0, maxStage: 0, over: false, reason: '' };
}

// dt 秒進める。出来事（windup / strike / feint / whiff / stray / bump / stage / end）を配列で返す
function stepGame(g, dt, press, CFG) {
  const ev = [];
  if (g.over) return ev;
  g.t += dt;
  const m = g.mole, R = CFG.rage, P = g.person;
  moleStep(m, dt, press, g.t, CFG);
  if (m.stun <= 0 && m.h >= CFG.score.scoreH) g.score += CFG.score.pps * g.mult * dt;
  for (const e of humanStep(g.human, dt, m, g.t, CFG, { stage: g.stage, rng: g.rng })) {
    ev.push(e);
    if (e.type !== 'impact') continue;
    if (e.hit) {
      g.bumps++; m.stun = CFG.mole.stunTime; m.hitT = 0;
      if (!g.noRage) g.rage *= P.hitKeep;                                    // 叩くとすっきりする（時間ではさめない。叩いたときだけ下がる）
      ev.push({ type: 'bump', bumps: g.bumps, hole: e.hole });
    } else if (e.empty) {
      ev.push({ type: 'flail', hole: e.hole });                              // 連打の素振り（避けたわけではないので点も怒りもなし）
    } else if (e.stray) {
      ev.push({ type: 'stray', hole: e.hole });                              // 隣を叩いてしまった（避けたわけではないので点も怒りもなし）
    } else {
      const pts = whiffPoints(e.close, g.mult, CFG);
      g.score += pts; g.whiffs++; g.bestClose = Math.max(g.bestClose, e.close);
      if (!g.noRage) g.rage = Math.min(R.max, g.rage + (R.whiffBase + R.whiffNear * e.close) * P.rageUp);
      ev.push({ type: 'whiff', close: e.close, gap: e.gap, pts, hole: e.hole, label: whiffLabel(e.close) });
    }
  }
  const st = stageOf(g.rage, CFG);
  if (st !== g.stage) { ev.push({ type: 'stage', stage: st, from: g.stage }); g.stage = st; g.mult = st + 1; g.maxStage = Math.max(g.maxStage, st); }
  if (g.bumps >= CFG.maxBumps) { g.over = true; g.reason = 'bumped'; ev.push({ type: 'end', reason: g.reason }); }
  else if (g.t >= CFG.duration) { g.over = true; g.reason = 'escaped'; ev.push({ type: 'end', reason: g.reason }); }
  return ev;
}

// ---- 演出の時間割（開始・退場）。three.js なしで決める ----
const INTRO_DUR = 3.2, OUTRO_DUR = 2.8;

// 開始：暗い地下から穴をのぞく → 人間が左から歩いてくる → コインを入れる → ハンマーを構えてにらむ
function introState(t) {
  const walkU = clamp((t - 0.3) / 1.4, 0, 1);
  return {
    x: -9 * (1 - easeOut(walkU)), walking: t >= 0.3 && t < 1.7,
    moleH: easeOut(clamp(t / 0.9, 0, 1)) * 0.9,          // モグラがそっと顔を出す
    camU: easeOut(clamp(t / 1.0, 0, 1)),                   // カメラが地下から目の高さへ上がる
    irisU: easeOut(clamp(t / 1.1, 0, 1)),                  // 穴の光が広がる
    coinU: t >= 1.7 && t < 2.3 ? (t - 1.7) / 0.6 : -1,     // コインが飛ぶ（-1＝飛んでいない）
    hoverU: easeOut(clamp((t - 2.1) / 0.5, 0, 1)),         // ハンマーを穴の上に構える
    mood: t < 2.1 ? 'calm' : 'aim',
  };
}

// 退場：逃げきり＝ハンマーを台に置いて、肩を落としてとぼとぼ去る（全員共通）／叩かれて終わり＝ガッツポーズして満足げに去る
function outroState(t, reason) {
  const esc = reason === 'escaped', leaveFrom = esc ? 1.3 : 1.0, walkU = clamp((t - leaveFrom) / 1.5, 0, 1);
  return {
    x: 9 * walkU * walkU, walking: walkU > 0 && walkU < 1,
    downU: esc ? easeOut(clamp(t / 0.7, 0, 1)) : 0,                                     // ハンマーを台に置く
    slumpU: esc ? easeOut(clamp((t - 0.6) / 0.6, 0, 1)) : 0,                            // 肩を落とす
    fistU: esc ? 0 : easeOut(clamp(t / 0.25, 0, 1)) * (1 - clamp((t - 0.8) / 0.3, 0, 1)),   // ガッツポーズ
    mood: esc ? (t < 0.6 ? 'calm' : 'sad') : 'happy',
    moleH: esc ? easeOut(clamp((t - 0.5) / 0.4, 0, 1)) : null,                          // 逃げきったモグラがぴょこっと出る
  };
}

// ---- X 共有 ----
// res＝{ name, score, maxStage, reason }
function shareText(res, cfg) {
  const line = res.maxStage > 0 ? res.name + 'を「' + cfg.stages[res.maxStage].name + '」まで怒らせた！' : res.name + 'に挑戦！';
  return '叩かれないモグラ：' + line + ' ' + res.score + '点' + (res.reason === 'escaped' ? '（逃げきり）' : '') + ' #' + cfg.share.hashtag;
}
// PC 用：X の投稿画面を開く URL
function tweetUrl(text, url) { return 'https://twitter.com/intent/tweet?text=' + encodeURIComponent(text) + (url ? '&url=' + encodeURIComponent(url) : ''); }
// ===== 3D の世界：モグラ叩き台・モグラ・人間・ハンマー =====

function lm(color, extra) { return new THREE.MeshLambertMaterial(Object.assign({ color }, extra)); }

function stripeTexture() {
  const c = document.createElement('canvas'); c.width = 256; c.height = 4;
  const g = c.getContext('2d');
  for (let i = 0; i < 16; i++) { g.fillStyle = i % 2 ? '#6a4a94' : '#5a3d82'; g.fillRect(i * 16, 0, 16, 4); }
  const t = new THREE.CanvasTexture(c); t.wrapS = THREE.RepeatWrapping; t.repeat.set(1, 1); return t;
}

// 台：穴の開いた押し出し形。上面は赤いプラスチック、穴の内側は暗い
function buildTable() {
  const HW = 3.9, HD = 4.0, DEPTH = 3.4, R = CFG.holes.r;
  const shape = new THREE.Shape();
  shape.moveTo(-HW, -HD); shape.lineTo(HW, -HD); shape.lineTo(HW, HD); shape.lineTo(-HW, HD); shape.lineTo(-HW, -HD);
  for (let i = 0; i < 9; i++) {
    const p = holePos(i, CFG), hole = new THREE.Path();
    hole.absarc(p.x, -p.z, R, 0, Math.PI * 2, true); shape.holes.push(hole);
  }
  const geo = new THREE.ExtrudeGeometry(shape, { depth: DEPTH, bevelEnabled: false, curveSegments: 32 });
  geo.rotateX(-Math.PI / 2); geo.translate(0, -DEPTH, 0);
  const top = new THREE.MeshPhongMaterial({ color: 0xe8453c, shininess: 70, specular: 0x886666 });
  const side = new THREE.MeshLambertMaterial({ color: 0x2a1a22 });
  const mesh = new THREE.Mesh(geo, [top, side]);
  return mesh;
}

function buildMole() {
  const g = new THREE.Group();
  const fur = lm(0x8a5a3c), dark = lm(0x2a1a14), pink = lm(0xf4a6b0);
  const body = new THREE.Mesh(new THREE.SphereGeometry(0.62, 24, 18), fur); body.scale.set(1, 1.2, 1); body.position.y = 0.62;
  const tube = new THREE.Mesh(new THREE.CylinderGeometry(0.62, 0.62, 1.5, 24), fur); tube.position.y = -0.13;
  g.add(body, tube);
  const shell = [body, tube];   // 一人称のとき隠す部分（鼻と手は残す）
  for (const s of [-1, 1]) {
    const ear = new THREE.Mesh(new THREE.SphereGeometry(0.17, 12, 10), fur); ear.position.set(s * 0.44, 1.2, 0.04); g.add(ear); shell.push(ear);
    const inner = new THREE.Mesh(new THREE.SphereGeometry(0.1, 10, 8), pink); inner.position.set(s * 0.44, 1.2, -0.08); g.add(inner); shell.push(inner);
    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.085, 10, 8), dark); eye.position.set(s * 0.24, 0.98, -0.53); g.add(eye); shell.push(eye);
    const hand = new THREE.Mesh(new THREE.SphereGeometry(0.14, 12, 10), pink); hand.position.set(s * 0.4, 0.66, -0.52); hand.scale.set(1, 0.7, 1.2); g.add(hand); shell.push(hand);
  }
  const nose = new THREE.Mesh(new THREE.SphereGeometry(0.11, 12, 10), pink); nose.position.set(0, 0.8, -0.64); g.add(nose); shell.push(nose);
  // 叩かれたときの星
  const stars = new THREE.Group(); stars.position.y = 1.75;
  for (let i = 0; i < 3; i++) {
    const s = new THREE.Mesh(new THREE.OctahedronGeometry(0.17), new THREE.MeshBasicMaterial({ color: 0xffd43b }));
    const a = i / 3 * Math.PI * 2; s.position.set(Math.cos(a) * 0.55, 0, Math.sin(a) * 0.55); stars.add(s);
  }
  stars.visible = false; g.add(stars);
  g.userData.stars = stars; g.userData.shell = shell;
  return g;
}

function buildHammer() {
  const g = new THREE.Group();
  const wood = lm(0xc98b4b), red = lm(0xe03131), gold = lm(0xffd43b);
  g.userData.mats = { head: red, band: gold, handle: wood };
  const head = new THREE.Mesh(new THREE.CylinderGeometry(0.62, 0.62, 1.9, 24), red); head.rotation.z = Math.PI / 2; head.position.y = 0.62;
  g.add(head);
  for (const s of [-1, 1]) { const band = new THREE.Mesh(new THREE.CylinderGeometry(0.64, 0.64, 0.14, 24), gold); band.rotation.z = Math.PI / 2; band.position.set(s * 0.8, 0.62, 0); g.add(band); }

function spawnPuffs(W, x, z, n, star) {

// 狙う穴とフェーズからハンマーの姿勢（足元＝頭の底の中心）を決める
function hammerGoal(kind, target) {
  if (kind === 'rest') return { x: 2.3, y: 1.3, z: -3.3, tilt: -0.25 };
  const p = holePos(target, CFG);
  if (kind === 'raised') return { x: p.x, y: 5.6, z: p.z - 0.5, tilt: -0.85 };
  if (kind === 'hover') return { x: p.x, y: 2.7, z: p.z - 0.4, tilt: -0.5 };           // 待ち伏せ：穴の上で構えて待つ
  return { x: p.x, y: 0.0, z: p.z - 0.35, tilt: 0.12 };            // strike
}

// 2本目のハンマー（錯乱）。1本目と同じ時間割で、前のポーズからの滑らかさは省く
function pose2For(hu) {
  const rest = hammerGoal('rest'), raised = hammerGoal('raised', hu.target2), hitP = hammerGoal('strike', hu.target2);
  if (hu.phase === 'windup') { const u = clamp(hu.t / hu.dur, 0, 1); return mixPose(rest, raised, easeOut(clamp(u / 0.7, 0, 1))); }
  if (hu.phase === 'strike') { const u = clamp(hu.t / CFG.human.strike, 0, 1); return mixPose(raised, hitP, u * u); }
  if (hu.phase === 'recover') { const u = clamp(hu.t / hu.recover, 0, 1); return mixPose(hitP, rest, easeOut(clamp((u - 0.35) / 0.65, 0, 1))); }

}

// 手とハンマーをつなぐ（ゴムの腕）。base＝肩の位置

  stretch(arm, base, grip, r); hand.position.copy(grip);
}

// ゲームの状態を 3D に反映する。X＝{ mode: 'play' | 'intro' | 'outro', t, reason }（演出中は人間・ハンマー・モグラをこちらの時間割で動かす）
function updateWorld(W, g, dt, now, X) {
  X = X || { mode: 'play', t: 0, reason: '' };
  const m = g.mole, hu = g.human, S = CFG.stages[g.stage];
  const ist = X.mode === 'intro' ? introState(X.t) : null, ost = X.mode === 'outro' ? outroState(X.t, X.reason) : null, scripted = !!(ist || ost);
  const escaped = X.reason === 'escaped';

  // --- 今回の人だけ見せる ---
  const H = W.humans[g.person.id];
  if (W.human !== H) { if (W.human) W.human.visible = false; W.human = H; H.visible = true; W.key = -1; applyHammerLook(W.hammer, LOOK[g.person.id].hammer); applyHammerLook(W.hammer2, LOOK[g.person.id].hammer); }
  const hsz = LOOK[g.person.id].hammer.size;
  const U = H.userData, hs = U.hs;
  H.position.x = ist ? ist.x : ost ? ost.x : 0;

  // --- モグラ ---
  const mp = holePos(m.hole, CFG);
  const mg = W.moleG;
  mg.position.set(mp.x, -2.15 + 2.15 * m.h, mp.z);
  mg.visible = m.h > 0.01;
  const flat = m.stun > CFG.mole.stunTime - CFG.mole.flatTime;
  mg.scale.set(flat ? 1.25 : 1, flat ? 0.6 : 1, flat ? 1.25 : 1);
  mg.rotation.z = m.stun > 0 ? Math.sin(now * 30) * 0.12 : Math.sin(now * 9) * 0.04 * m.h;
  if (ost && escaped && ost.moleH > 0.9) { mg.position.y += Math.abs(Math.sin(now * 9)) * 0.35; mg.rotation.z = Math.sin(now * 12) * 0.2; }   // 逃げきったモグラが跳ねて喜ぶ
  const stars = mg.userData.stars;
  stars.visible = m.stun > 0; stars.rotation.y = now * 9;
  stars.position.y = 1.75 + 0.15 * Math.sin(now * 12);
  if (m.stun > 0) mg.visible = true;
  for (const part of mg.userData.shell) part.visible = !W.fpsView;

  // --- ハンマー（1本目） ---
  if (hu.seq !== W.key) { W.key = hu.seq; W.from = { x: W.pose.x, y: W.pose.y, z: W.pose.z, tilt: W.pose.tilt }; }
  const rest = hammerGoal('rest'), tg = hu.target >= 0 ? hu.target : 4;
  let raised = hammerGoal('raised', tg); const hitP = hammerGoal('strike', tg), hover = hammerGoal('hover', tg);
  if (hu.feint) raised = { x: raised.x, y: lerp(rest.y, raised.y, 0.62), z: raised.z, tilt: lerp(rest.tilt, raised.tilt, 0.62) };   // フェイントは上げきらない（見分けるヒント）
  let pose;
  if (ist) {                                                           // 開始：ハンマーを持って歩いてきて、穴の上に構える
    const carry = Object.assign({}, rest, { x: rest.x + ist.x });
    pose = mixPose(carry, hammerGoal('hover', 4), ist.hoverU);
  } else if (ost) {                                                    // 退場：台に置く／ガッツポーズ／持って去る
    const carry = Object.assign({}, rest, { x: rest.x + ost.x });
    if (escaped) pose = mixPose(carry, { x: 1.8, y: 0.38, z: -0.9, tilt: 1.45 }, ost.downU);
    else pose = mixPose(carry, { x: 2.0 + ost.x, y: 4.4, z: -3.4, tilt: -0.25 }, ost.fistU);
  } else if (hu.phase === 'windup') {

    if (hu.strayed) pose.x += Math.sin(now * 13) * 0.5 * easeOut(clamp(u / 0.7, 0, 1));   // 雑：狙いがふらふら揺れる
  } else if (hu.phase === 'strike') {
    const u = clamp(hu.t / CFG.human.strike, 0, 1);
    pose = mixPose(raised, hitP, u * u);
  } else if (hu.phase === 'ambush') {
    pose = mixPose(W.from, hover, easeOut(clamp(hu.t / 0.25, 0, 1)));
    pose.y += Math.sin(now * 9) * 0.06;
  } else if (hu.phase === 'recover') {
    const u = clamp(hu.t / hu.recover, 0, 1);
    if (hu.mood === 'feint') {   // 途中まで振り下ろして空中でぴたっと止め、にやり。そのあと引く（「わざと」と分かる動き）
      const fake = mixPose(W.from, hitP, 0.28);
      pose = u < 0.3 ? mixPose(W.from, fake, Math.sqrt(u / 0.3)) : u < 0.65 ? { x: fake.x + Math.sin(now * 40) * 0.05, y: fake.y + Math.sin(now * 34) * 0.04, z: fake.z, tilt: fake.tilt } : mixPose(fake, rest, easeOut((u - 0.65) / 0.35));
    } else if (hu.mood === 'happy' || hu.mood === 'miss' || hu.mood === 'confuse') {   // 叩いた位置でしばらく止めてから戻す
      pose = mixPose(hitP, rest, easeOut(clamp((u - 0.35) / 0.65, 0, 1)));
      if (hu.mood === 'miss' && U.id === 'kid') pose.y += Math.abs(Math.sin(hu.t * 17)) * 0.5 * (1 - u) * (u < 0.6 ? 1 : 0);   // 悔しくてハンマーを台にトントン（立ち直りの時間の中だけ）
    } else pose = mixPose(W.from, rest, easeOut(u));

  const sc = W.scaleS * hsz;   // 段階の大きさ × 人ごとのハンマーの大きさ
  const hm = W.hammer; hm.scale.setScalar(sc); hm.position.set(pose.x, pose.y, pose.z); hm.rotation.x = pose.tilt;

  // --- ハンマー（2本目：錯乱） ---
  const two = !scripted && hu.target2 >= 0 && (hu.phase === 'windup' || hu.phase === 'strike' || hu.phase === 'recover');
  W.hammer2.visible = two; U.armR2.visible = U.handR2.visible = two;
  let pose2 = null;
  if (two) {
    pose2 = pose2For(hu);
    const h2 = W.hammer2; h2.scale.setScalar(CFG.stages[hu.stage].scale * hsz); h2.position.set(pose2.x, pose2.y, pose2.z); h2.rotation.x = pose2.tilt;
  }

  // 影と縁（予告）
  const warn = !scripted && (hu.phase === 'windup' || hu.phase === 'strike');
  for (let i = 0; i < 9; i++) {
    const hot = warn && (i === hu.target || i === hu.target2) && !hu.feint;
    W.rims[i].material.color.setHex(hot ? (Math.floor(now * 14) % 2 ? 0xff3b30 : 0xffd43b) : 0xffd43b);
  }
  const shade = (sh, target, on, u, scale) => {
    if (on) { const tp = holePos(target, CFG); sh.position.set(tp.x, 0.03, tp.z); sh.scale.setScalar(lerp(0.5, 1.15, u) * scale); sh.material.opacity = lerp(0.1, 0.5, u); }
    else sh.material.opacity = Math.max(0, sh.material.opacity - dt * 3);
  };

  shade(W.shadow2, hu.target2, warn && hu.target2 >= 0, wu, CFG.stages[hu.stage].scale * hsz);

    coin.visible = true; coin.position.set(lerp(1.6, 0.9, u), lerp(2.6, 0.18, u) + Math.sin(Math.PI * u) * 1.6, lerp(-4.2, -3.0, u)); coin.rotation.x = now * 16; coin.rotation.z = now * 5;

  if (ost && escaped && ost.downU >= 0.99) {                                      // ハンマーを置いたあと、手をだらんと下げる
    const hang = _v1.set(humanPos.x + 1.9 * hs, 1.0 * hs, humanPos.z + 0.7);
    stretch(U.armR, shR, hang, 0.3); U.handR.position.copy(hang);
  } else reach(U, U.armR, U.handR, shR, pose, sc, 0.3);
  U.armR.position.sub(humanPos); U.handR.position.sub(humanPos);
  if (two) {
    const shR2 = _v3.set(humanPos.x - 1.65 * hs, 2.8 * hs, humanPos.z + 0.1 * hs);
    reach(U, U.armR2, U.handR2, shR2, pose2, CFG.stages[hu.stage].scale * hsz, 0.3);

  stage.addEventListener('pointerup', release); stage.addEventListener('pointercancel', release);

  // ---- 音（♪ で入り切り。iPhone などは操作のたびに有効化する） ----
  $('soundBtn').classList.toggle('off', SFX.isMuted());
  $('soundBtn').addEventListener('click', e => { e.stopPropagation(); SFX.unlock(); SFX.setMuted(!SFX.isMuted()); $('soundBtn').classList.toggle('off', SFX.isMuted()); if (!SFX.isMuted()) setTimeout(SFX.blip, 80); });
  for (const ev of ['pointerdown', 'pointerup', 'touchend', 'click']) addEventListener(ev, () => SFX.unlock(), { capture: true });

  // ---- X 共有：スマホは画像つき（Web Share API）、PC は X の投稿画面（文章＋URL。画像は自動では付けられない） ----
  function resultCanvas() {
    const r = lastResult || { name: '', score: 0, maxStage: 0, stageName: '平静', whiffs: 0, reason: 'escaped', best: 0 };
    const c = document.createElement('canvas'); c.width = 1080; c.height = 1350;
    const x = c.getContext('2d'), F = '"Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif';
    const bg = x.createLinearGradient(0, 0, 0, 1350); bg.addColorStop(0, '#4a2f6b'); bg.addColorStop(1, '#1d1530');
    x.fillStyle = bg; x.fillRect(0, 0, 1080, 1350);
    x.fillStyle = 'rgba(255,255,255,.06)'; for (let i = 0; i < 9; i++) { x.beginPath(); x.ellipse(180 + (i % 3) * 360, 1020 + Math.floor(i / 3) * 110, 110, 40, 0, 0, Math.PI * 2); x.fill(); }   // 台の穴
    x.textAlign = 'center'; x.fillStyle = '#fff'; x.font = '900 72px ' + F; x.fillText('叩かれないモグラ', 540, 180);
    x.fillStyle = '#c9c0e0'; x.font = '700 48px ' + F; x.fillText(r.reason === 'escaped' ? '60 秒、逃げきった' : '叩かれてしまった…', 540, 260);
    x.font = '900 330px ' + F; const sw = x.measureText(String(r.score)).width; x.font = '900 100px ' + F; const uw = x.measureText('点').width;   // 数字の右に「点」を並べる
    const sx = 540 - (sw + 16 + uw) / 2; x.textAlign = 'left';
    x.fillStyle = '#ffd43b'; x.font = '900 330px ' + F; x.fillText(String(r.score), sx, 680);
    x.fillStyle = '#fff'; x.font = '900 100px ' + F; x.fillText('点', sx + sw + 16, 680); x.textAlign = 'center';
    x.fillStyle = '#fff'; x.font = '700 54px ' + F; x.fillText(r.name, 540, 860);
    x.fillStyle = STAGE_COLORS[r.maxStage]; x.font = '900 76px ' + F; x.fillText(r.maxStage > 0 ? '「' + r.stageName + '」まで怒らせた' : '最後まで平静だった', 540, 960);
    x.fillStyle = '#c9c0e0'; x.font = '700 46px ' + F; x.fillText('空振りさせた ' + r.whiffs + ' 回　自己ベスト ' + r.best + ' 点', 540, 1100);
    x.fillText('#' + CFG.share.hashtag, 540, 1250);
    return c;
  }
  async function share() {
    if (!lastResult) return;
    const url = CFG.share.url || (/^https?:/.test(location.href) ? location.href.split('#')[0] : '');
    const text = shareText(lastResult, CFG);
    if (matchMedia('(pointer: coarse)').matches && navigator.share && navigator.canShare) {
      try {
        const blob = await new Promise(r => resultCanvas().toBlob(r, 'image/png'));
        const file = new File([blob], 'mole-tease.png', { type: 'image/png' });
        if (navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], text: text + (url ? ' ' + url : '') }); return; }
      } catch (e) { if (e && e.name === 'AbortError') return; }
    }
    window.open(tweetUrl(text, url), '_blank', 'noopener');
  }
  $('shareBtn').addEventListener('click', share);

  // ---- 出来事の見た目と音 ----
  function onEvents(evs) {
    for (const e of evs) {
      if (e.type === 'windup') SFX.windup(e.dur);
      else if (e.type === 'feint') SFX.feint();
      else if (e.type === 'impact') {
        shakeAmp = Math.max(shakeAmp, e.hit ? 0.5 : 0.18);
        SFX.slam(g.stage >= 3);
        if (e.hit) { const f = $('flash'); f.classList.remove('on'); void f.offsetWidth; f.classList.add('on'); }
        const p = holePos(e.hole, CFG); spawnPuffs(W, p.x, p.z, e.hit ? 8 : 6); if (e.hit) spawnPuffs(W, p.x, p.z, 7, true);   // 叩かれたら黄色い星が弾ける
      } else if (e.type === 'whiff') {
        SFX.whiff(e.close);
        if (e.close >= 0.7) { pop(e.label + '<small>+' + e.pts + '</small>', 'great'); slowT = 0.5; kick = Math.max(kick, 0.5); SFX.slowmo(); }   // 紙一重はスロー
        else if (e.close >= 0.35) pop(e.label + '<small>+' + e.pts + '</small>', 'near');
        else pop(e.label + '<small>+' + e.pts + '</small>', 'miss');
        $('scoreBox').classList.remove('bump'); void $('scoreBox').offsetWidth; $('scoreBox').classList.add('bump');
      } else if (e.type === 'stage') {
        shakeAmp = Math.max(shakeAmp, 0.35);
        // 段階アップは「この瞬間」だと分かるように：一瞬止まる（ヒットストップ）・段階の色で画面が縁取られて光る・画面が大きくゆれて画角がはずむ・人間がぷくっと膨らむ・ゲージ、倍率が光る。
        // 文字は空振りの文字と重ならないよう少しあとに、段階名だけを別の場所に出す
        const rg = $('rage'); rg.classList.remove('up', 'down'); void rg.offsetWidth; rg.classList.add(e.stage > e.from ? 'up' : 'down');
        const rn = $('rageName'); rn.classList.remove('bump'); void rn.offsetWidth; rn.classList.add('bump');
        const mb = $('multBox'); mb.classList.remove('bump'); void mb.offsetWidth; mb.classList.add('bump');
        if (e.stage > e.from) {
          hold = 0.14; kick = 1; shakeAmp = Math.max(shakeAmp, 0.7); W.pulse = 1; SFX.stage(e.stage);
          const sf = $('sflash'); sf.style.setProperty('--sc', STAGE_COLORS[e.stage]); sf.classList.remove('on'); void sf.offsetWidth; sf.classList.add('on');
          const nm = CFG.stages[e.stage].name; setTimeout(() => { if (state === 'play') pop(nm + '！', 'rage', 'stage'); }, 650);
        } else SFX.cool();
      } else if (e.type === 'bump') {
        pop('ピコッ！', 'bad'); SFX.bump();
      } else if (e.type === 'end') endGame();
    }
  }

  // ---- メインループ ----
  let last = performance.now(), simT = 0;
  function frame(nowMs) {
    const real = Math.min(0.05, (nowMs - last) / 1000); last = nowMs;
    slowT = Math.max(0, slowT - real);
    const dt = paused ? 0 : real * (slowT > 0 ? 0.3 : 1); simT += dt;    // 紙一重のあとは少しスロー

    if (state === 'play' && !freeze && !paused) {
      if (hold > 0) hold -= dt; else { onEvents(stepGame(g, dt, press, CFG)); refreshHud(); }
      // 顔を出す・引っ込む音、残り 10 秒のカチ
      if (prevH < 0.05 && g.mole.h >= 0.05) SFX.pop(); else if (prevH > 0.3 && g.mole.h <= 0.3) SFX.hide();
      prevH = g.mole.h;
      const left = Math.ceil(CFG.duration - g.t); if (left <= 10 && left > 0 && left !== lastTick) { lastTick = left; SFX.tick(); }
    } else if (state === 'intro') {
      introT += dt; const ist = introState(introT);
      g.mole.h = ist.moleH;
      if (!introFlags.pop && introT > 0.5) { introFlags.pop = true; SFX.pop(); }
      if (ist.walking) { stepT -= dt; if (stepT <= 0) { stepT = 0.34; SFX.step(); } }
      if (!introFlags.coin && introT > 1.95) { introFlags.coin = true; SFX.coin(); }
      $('iris').style.setProperty('--r', (ist.irisU * 100) + '%'); $('iris').style.opacity = 1 - clamp((introT - 1.1) / 0.4, 0, 1);
      if (introT >= INTRO_DUR) { beginPlay(); }
    } else if (state === 'outro' || state === 'over') {
      if (state === 'outro') {
        outroT += dt; const ost = outroState(outroT, g.reason);
        if (ost.moleH != null) g.mole.h = ost.moleH;
        if (ost.walking) { stepT -= dt; if (stepT <= 0) { stepT = g.reason === 'escaped' ? 0.5 : 0.3; SFX.step(); } }
        if (outroT >= OUTRO_DUR) { state = 'over'; show('overScr', true); }
      }
    }
    const X = state === 'intro' ? { mode: 'intro', t: introT } : (state === 'outro' || state === 'over') ? { mode: 'outro', t: Math.min(outroT, OUTRO_DUR), reason: g.reason } : { mode: 'play', t: 0 };
    updateWorld(W, g, dt, simT, X);

    // 出ている間は一人称：出ている穴の、モグラの目の位置へカメラが降りる（押す位置の判定は俯瞰のカメラ基準のまま）。開始は地下から上がってくる
    const P = CFG.fps, mp = holePos(g.mole.hole, CFG), ist2 = state === 'intro' ? introState(introT) : null;
    peek += ((ist2 ? P.amt : state === 'play' ? clamp(g.mole.h, 0, 1) * P.amt : 0) - peek) * (1 - Math.exp(-real * P.rate));
    camX += (mp.x - camX) * (1 - Math.exp(-real * P.rate));
    shakeAmp = Math.max(0, shakeAmp - real * 1.4);
    const eyeY = ist2 ? lerp(-0.95, P.eyeBase + P.eyeK * 0.9, ist2.camU) : P.eyeBase + P.eyeK * g.mole.h;
    const sx = (Math.random() - 0.5) * shakeAmp, sy = (Math.random() - 0.5) * shakeAmp;
    tilt += ((state === 'play' && (g.human.phase === 'windup' || g.human.phase === 'strike') && g.human.target === g.mole.hole ? 1 : 0) - tilt) * (1 - Math.exp(-real * P.tiltRate));
    const pitch = (P.pitch + (ist2 ? (1 - ist2.camU) * 34 : 0) + P.windupPitch * tilt) * Math.PI / 180;
    camera.position.set(lerp(C.pos[0], camX, peek) + sx, lerp(C.pos[1], eyeY, peek) + sy, lerp(C.pos[2], mp.z + P.back, peek));
    camera.lookAt(lerp(C.look[0], camX * P.lookXk, peek), lerp(C.look[1], eyeY + P.lookDist * Math.tan(pitch), peek), lerp(C.look[2], mp.z - P.lookDist, peek));
    kick = Math.max(0, kick - real * 3);
    const fov = lerp(baseFov, P.fov, peek) + 9 * kick;
    if (Math.abs(camera.fov - fov) > 0.01) { camera.fov = fov; camera.updateProjectionMatrix(); }
    W.fpsView = peek > P.hideAt;
    $('tunnel').style.opacity = peek;
    {   // 危険の知らせ：振りかぶりが進むほど画面の縁が赤く、脈打つ。タイミングバーは「ここで離すと紙一重」の帯つき
      const hu = g.human, A = CFG.assist, danger = state === 'play' && (hu.phase === 'windup' || hu.phase === 'strike') && !hu.feint;
      const total = hu.dur + CFG.human.strike, u = danger ? clamp((hu.phase === 'windup' ? hu.t : hu.dur + hu.t) / total, 0, 1) : 0;
      $('danger').style.opacity = danger ? clamp(Math.pow(u, 1.5) * (0.65 + 0.35 * Math.sin(simT * (9 + 18 * u))) + 0.08, 0, 1) : 0;
      const showBar = danger && A.bar;
      $('clock').classList.toggle('on', showBar); $('clockLab').classList.toggle('on', showBar && g.whiffs < 3);
      if (showBar) $('clockFill').style.width = (u * 100) + '%';
    }
    const mini = $('mini'); mini.classList.toggle('on', state === 'play' && peek > 0.2);
    if (state === 'play') { const cells = mini.children, hu = g.human, on = (hu.phase === 'windup' || hu.phase === 'strike') && !hu.feint, rc = CFG.stages[hu.stage].reach; for (let i = 0; i < 9; i++) cells[i].className = on && (i === hu.target || i === hu.target2) ? 'tg' : on && rc && ((hu.target >= 0 && rowOf(i) === rowOf(hu.target) && Math.abs(colOf(i) - colOf(hu.target)) <= rc) || (hu.target2 >= 0 && rowOf(i) === rowOf(hu.target2) && Math.abs(colOf(i) - colOf(hu.target2)) <= rc)) ? 'rc' : i === g.mole.hole ? 'me' : ''; }
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  refreshHud();
  requestAnimationFrame(frame);

  // 検証用の窓口（遊ぶのには使わない）
  window.__t = {
    start: startGame, state: () => state, game: () => g, holePts: () => holePts.map(p => ({ x: Math.round(p.x), y: Math.round(p.y) })),
    setPress: h => { press = h; }, freeze: f => { freeze = f; }, skip: () => { if (state === 'intro') { beginPlay(); g.mole.h = 0; } }, setIntroT: t => { introT = t; }, introT: () => introT, outroT: () => outroT, setOutroT: t => { outroT = t; }, scene, camera, W,
  };
})();
</script>
