<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>叩かれないモグラ</title>
<style>
  :root{--u:3.75px;--ink:#2b2433;--bg:#4a2f6b;--jp:"Hiragino Kaku Gothic ProN","Yu Gothic","YuGothic","Meiryo","Noto Sans JP",sans-serif}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:#141018;color:var(--ink);font-family:var(--jp);touch-action:none;user-select:none;-webkit-user-select:none;overscroll-behavior:none;-webkit-touch-callout:none}
  html,body{height:100vh;height:100dvh}
  body{word-break:auto-phrase;overflow-wrap:anywhere;line-break:strict}
  p,h1,h2{text-wrap:balance}
  button{font-family:var(--jp);touch-action:manipulation;cursor:pointer}
  .nw{white-space:nowrap}
  .ph{display:inline-block}

  #stage{position:fixed;top:0;height:100vh;left:50%;transform:translateX(-50%);width:min(100vw,56.25vh);overflow:hidden;background:var(--bg);box-shadow:0 0 0 1px rgba(255,255,255,.08),0 0 60px rgba(0,0,0,.7);touch-action:none}
  @supports (height:100dvh){#stage{height:100dvh;width:min(100vw,56.25dvh)}}
  #view{position:absolute;inset:0;overflow:hidden}
  #view canvas{display:block;width:100%;height:100%}

  #hud{position:absolute;left:0;right:0;top:0;z-index:5;pointer-events:none;padding:calc(env(safe-area-inset-top) + var(--u)*2.5) calc(var(--u)*3) 0;opacity:0;transition:opacity .25s}
  #hud.on{opacity:1}
  .row{display:flex;gap:calc(var(--u)*2);align-items:stretch}
  .chip{display:flex;align-items:center;justify-content:center;gap:calc(var(--u)*1.4);padding:0 calc(var(--u)*3);height:calc(var(--u)*10);border-radius:calc(var(--u)*3);background:rgba(255,255,255,.9);box-shadow:0 2px 0 rgba(0,0,0,.2);font-weight:900;line-height:1.1;white-space:nowrap}
  .chip small{font-size:calc(var(--u)*2.8);letter-spacing:.1em;opacity:.65;font-weight:700}
  .chip b{font-size:calc(var(--u)*6.5);font-variant-numeric:tabular-nums}
  #scoreBox{flex:1.5} #scoreBox b{color:#e8590c}
  #timeBox{flex:1}
  #timeBox.low b{color:#e03131}
  #bumpBox{flex:1.1}
  .lump{display:inline-block;width:calc(var(--u)*5.4);height:calc(var(--u)*5.4);border-radius:50%;background:#e9ecef;border:calc(var(--u)*.6) solid #adb5bd}
  .lump.on{background:#ff8787;border-color:#e03131}
  #scoreBox.bump{animation:bump .3s ease-out}
  @keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.2)}100%{transform:scale(1)}}

  #pops{position:absolute;left:50%;top:38%;z-index:6;pointer-events:none}
  .pop{position:absolute;left:0;transform:translateX(-50%);font-size:calc(var(--u)*11);font-weight:900;white-space:nowrap;-webkit-text-stroke:calc(var(--u)*.8) #fff;paint-order:stroke fill;animation:floatUp 1.1s ease-out forwards}
  .pop small{display:block;text-align:center;font-size:.6em}
  .pop.near{color:#e8590c;font-size:calc(var(--u)*13)} .pop.great{color:#d6336c;font-size:calc(var(--u)*15)} .pop.miss{color:#7048e8;font-size:calc(var(--u)*9)} .pop.bad{color:#e03131}
  @keyframes floatUp{0%{opacity:0;margin-top:calc(var(--u)*3);scale:.6}15%{opacity:1;scale:1.15}30%{scale:1}100%{opacity:0;margin-top:calc(var(--u)*-16)}}

  #hint{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + var(--u)*8);z-index:5;pointer-events:none;text-align:center;color:#fff;font-size:calc(var(--u)*4.6);font-weight:900;text-shadow:0 2px 6px rgba(0,0,0,.8);opacity:0;transition:opacity .3s;line-height:1.5}
  #hint.on{opacity:1}

  .screen{position:absolute;inset:0;z-index:10;display:none;flex-direction:column;align-items:center;justify-content:safe center;gap:calc(var(--u)*4);padding:calc(var(--u)*8);background:rgba(20,14,30,.72);color:#fff;text-align:center;overflow:auto}
  .screen.on{display:flex}
  .screen h1{font-size:calc(var(--u)*11);font-weight:900;line-height:1.25;text-shadow:0 3px 0 rgba(0,0,0,.4)}
  .screen h2{font-size:calc(var(--u)*8);font-weight:900}
  .screen p{font-size:calc(var(--u)*4.4);line-height:1.7;font-weight:700}
  #overNew{display:none;padding:calc(var(--u)*1) calc(var(--u)*5);border-radius:calc(var(--u)*5);background:#ff6b6b;color:#fff;font-weight:900;font-size:calc(var(--u)*5);animation:bump .5s ease-out}
  #overNew.on{display:block}
  .sbtn{border:1px solid rgba(255,255,255,.45);background:transparent;color:#fff;border-radius:calc(var(--u)*4);padding:calc(var(--u)*1.8) calc(var(--u)*6);font-size:calc(var(--u)*3.8);font-weight:700}
  .sbtn:active{background:rgba(255,255,255,.15)}
  .big{font-size:calc(var(--u)*22);font-weight:900;color:#ffd43b;line-height:1;font-variant-numeric:tabular-nums}
  .btn{border:0;border-radius:calc(var(--u)*5);padding:calc(var(--u)*3.4) calc(var(--u)*10);font-size:calc(var(--u)*6);font-weight:900;background:#ffd43b;color:#3b2a00;box-shadow:0 calc(var(--u)*1) 0 #c99a00}
  .btn:active{transform:translateY(2px);box-shadow:0 calc(var(--u)*.4) 0 #c99a00}
</style>
</head>
<body>
<div id="stage">
  <div id="view"></div>
  <div id="hud">
    <div class="row">
      <div class="chip" id="scoreBox"><small>点</small><b id="score">0</b></div>
      <div class="chip" id="timeBox"><small>残り</small><b id="time">60</b></div>
      <div class="chip" id="bumpBox"><span class="lump" id="lump0"></span><span class="lump" id="lump1"></span><span class="lump" id="lump2"></span></div>
    </div>
  </div>
  <div id="pops"></div>
  <div id="hint"><span class="ph">押している間だけ</span><span class="ph">顔を出す</span><br><span class="ph">ハンマーが来る前に</span><span class="ph">離せ</span></div>

  <div class="screen on" id="titleScr">
    <h1><span class="ph">叩かれない</span><span class="ph">モグラ</span></h1>
    <p><span class="ph">モグラ叩きを、</span><span class="ph">モグラ側で。</span><br><span class="ph">ギリギリで引っ込んで、</span><span class="ph">人間をムキにさせろ。</span></p>
    <p class="nw">自己ベスト <b id="titleBest">0</b> 点</p>
    <button class="btn" id="startBtn">はじめる</button>
  </div>
  <div class="screen" id="overScr">
    <h2 id="overTitle">逃げきり！</h2>
    <p>点</p>
    <div class="big" id="overScore">0</div>
    <div id="overNew">新記録！</div>
    <p class="nw" id="overStat"></p>
    <p class="nw" id="overBest"></p>
    <button class="btn" id="againBtn">もう一回</button>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
"use strict";
// ===== 調整用の数値（遊んで直す） =====
// 穴は 3×3。行 0＝奥（人間に近い）、行 2＝手前（こちらに近い）。座標の単位はおもちゃの台の「メートルもどき」
const CFG = {
  duration: 60,           // 逃げきりまでの秒数
  maxBumps: 3,            // たんこぶがこの数で終わり
  holes: { dx: 1.8, dz: 2.1, z0: -2.1, r: 0.8 },   // 穴の間隔（横・奥行き）、いちばん奥の行の z、穴の半径
  mole: {
    rise: 7.5,            // 出る速さ（高さ 0〜1 を毎秒）
    fall: 9,              // 引っ込む速さ
    moveTime: 0.2,        // 別の穴へ地下を移る時間
    hitH: 0.3,            // この高さより上に出ていたら叩かれる
    exposeH: 0.5,         // この高さ以上で「顔を出している」＝人間に見つかる・点が入る
    flatH: 0.4,           // 叩かれてつぶれた高さ
    flatTime: 0.35,       // つぶれたままの時間
    stunTime: 0.9,        // 叩かれてから出られない時間
  },
  human: {
    firstWait: 1.6,       // 開始してから最初に狙うまでの待ち
    reaction: 0.28,       // モグラが出てから人間が気づくまで（これ未満で引っ込めば狙われない）
    windup: 0.70,         // 振りかぶり（予告）の長さ
    strike: 0.12,         // 振り下ろしの長さ
    recoverMiss: 0.55,    // 空振り後に次を狙えるまで
    recoverHit: 1.0,      // 当てたあと
    idleWait: 0.15,       // 次を狙う前のひと呼吸
  },
  score: {
    pps: 100,             // 顔を出している間の毎秒の点
    whiffBase: 50,        // 空振りさせたときの基本点
    whiffNear: 450,       // ギリギリなほど足される点（closeness の2乗で効く）
    nearWindow: 0.30,     // 人間が叩く直前、何秒以内に引っ込んだらギリギリとみなすか
    scoreH: 0.5,          // この高さ以上で点が入る
  },
  // カメラ：モグラの目の高さ。台の手前の端から奥の人間を見上げる／少し見下ろす
  cam: { pos: [0, 6.0, 7.2], look: [0, 2.4, -1.6], hfov: 48 },
};
// ===== 判定・点数・人間の動き（three.js を使わない純粋ロジック） =====
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));

// 穴 i（0〜8）の台上の位置。行 0＝奥、行 2＝手前
function holePos(i, CFG) {
  const H = CFG.holes;
  return { x: (i % 3 - 1) * H.dx, z: H.z0 + Math.floor(i / 3) * H.dz };
}

// 画面の座標（px）から押している穴を決める。cur＝今押している穴、hyst＝今の穴を離れにくくする倍率
function pickHole(px, py, pts, cur, hyst) {
  let best = -1, bd = Infinity;
  for (let i = 0; i < pts.length; i++) {
    const d = Math.hypot(pts[i].x - px, pts[i].y - py);
    if (d < bd) { bd = d; best = i; }
  }
  if (cur >= 0 && cur < pts.length && cur !== best) {
    const dc = Math.hypot(pts[cur].x - px, pts[cur].y - py);
    if (dc <= bd * (hyst || 1.25)) return cur;
  }
  return best;
}

// ---- モグラ ----
function newMole() {
  return { hole: 4, h: 0, dest: -1, travel: 0, stun: 0, hitT: 99, upSince: -1, exitTs: new Array(9).fill(-99) };
}

// press＝押している穴（なければ -1）、now＝ゲーム内の経過秒
function moleStep(m, dt, press, now, CFG) {
  const M = CFG.mole;
  const hPrev = m.h;
  m.hitT += dt;
  if (m.stun > 0) {
    m.stun = Math.max(0, m.stun - dt);
    m.travel = 0; m.dest = -1;
    if (m.stun > M.stunTime - M.flatTime) m.h = M.flatH;
    else m.h = Math.max(0, m.h - M.fall * dt);
  } else if (press >= 0 && press !== m.hole) {
    // 別の穴へ：いまの穴で引っ込み、地下を移ってから出る
    if (m.h > 0) m.h = Math.max(0, m.h - M.fall * dt);
    else {
      if (m.dest !== press) { m.dest = press; m.travel = M.moveTime; }
      m.travel -= dt;
      if (m.travel <= 0) { m.hole = m.dest; m.dest = -1; m.travel = 0; }
    }
  } else if (press === m.hole) {
    m.dest = -1; m.travel = 0;
    m.h = Math.min(1, m.h + M.rise * dt);
  } else {
    m.dest = -1; m.travel = 0;
    m.h = Math.max(0, m.h - M.fall * dt);
  }
  if (hPrev > M.hitH && m.h <= M.hitH) m.exitTs[m.hole] = now;     // 叩かれる高さを離れた時刻（ギリギリ度に使う）
  if (m.h >= M.exposeH && m.stun <= 0) { if (m.upSince < 0) m.upSince = now; } else m.upSince = -1;
}

function isHittable(m, CFG) { return m.stun <= 0 && m.travel === 0 && m.h > CFG.mole.hitH; }

// ---- 人間 ----
function newHuman(CFG) {
  return { phase: 'idle', t: 0, seq: 0, wait: CFG.human.firstWait, target: -1, recover: 0, mood: 'calm' };   // seq＝フェーズが変わるたびに増える（見た目の切り替え用）
}

// 人間の 1 コマ。出来事（windup / strike / impact）を配列で返す
function humanStep(hu, dt, m, now, CFG) {
  const Hc = CFG.human, ev = [];
  hu.t += dt;
  if (hu.phase === 'idle') {
    hu.wait -= dt;
    if (hu.wait <= 0 && m.stun <= 0 && m.upSince >= 0 && now - m.upSince >= Hc.reaction) {
      hu.phase = 'windup'; hu.t = 0; hu.seq++; hu.target = m.hole; hu.mood = 'aim';
      ev.push({ type: 'windup', hole: hu.target });
    }
  } else if (hu.phase === 'windup') {
    if (hu.t >= Hc.windup) { hu.phase = 'strike'; hu.t = 0; hu.seq++; ev.push({ type: 'strike', hole: hu.target }); }
  } else if (hu.phase === 'strike') {
    if (hu.t >= Hc.strike) {
      const hit = m.hole === hu.target && isHittable(m, CFG);
      let gap = null, close = 0;
      if (!hit) {
        gap = Math.max(0, now - m.exitTs[hu.target]);
        close = clamp(1 - gap / CFG.score.nearWindow, 0, 1);
      }
      ev.push({ type: 'impact', hole: hu.target, hit, gap, close });
      hu.phase = 'recover'; hu.t = 0; hu.seq++; hu.recover = hit ? Hc.recoverHit : Hc.recoverMiss; hu.mood = hit ? 'happy' : 'miss';
    }
  } else if (hu.phase === 'recover') {
    if (hu.t >= hu.recover) { hu.phase = 'idle'; hu.t = 0; hu.seq++; hu.wait = Hc.idleWait; hu.mood = 'calm'; }
  }
  return ev;
}

// ---- 点数 ----
function whiffPoints(close, mult, CFG) { return Math.round((CFG.score.whiffBase + CFG.score.whiffNear * close * close) * mult); }
function whiffLabel(close) { return close >= 0.7 ? '紙一重！' : close >= 0.35 ? 'ギリギリ！' : 'スカッ'; }

// ---- ゲーム全体 ----
function newGame(CFG) {
  return { t: 0, mole: newMole(), human: newHuman(CFG), score: 0, bumps: 0, whiffs: 0, bestClose: 0, mult: 1, over: false, reason: '' };
}

// dt 秒進める。出来事（windup / strike / whiff / bump / end）を配列で返す
function stepGame(g, dt, press, CFG) {
  const ev = [];
  if (g.over) return ev;
  g.t += dt;
  const m = g.mole;
  moleStep(m, dt, press, g.t, CFG);
  if (m.stun <= 0 && m.h >= CFG.score.scoreH) g.score += CFG.score.pps * g.mult * dt;
  for (const e of humanStep(g.human, dt, m, g.t, CFG)) {
    ev.push(e);
    if (e.type !== 'impact') continue;
    if (e.hit) {
      g.bumps++; m.stun = CFG.mole.stunTime; m.hitT = 0;
      ev.push({ type: 'bump', bumps: g.bumps, hole: e.hole });
    } else {
      const pts = whiffPoints(e.close, g.mult, CFG);
      g.score += pts; g.whiffs++; g.bestClose = Math.max(g.bestClose, e.close);
      ev.push({ type: 'whiff', close: e.close, gap: e.gap, pts, hole: e.hole, label: whiffLabel(e.close) });
    }
  }
  if (g.bumps >= CFG.maxBumps) { g.over = true; g.reason = 'bumped'; ev.push({ type: 'end', reason: g.reason }); }
  else if (g.t >= CFG.duration) { g.over = true; g.reason = 'escaped'; ev.push({ type: 'end', reason: g.reason }); }
  return ev;
}
// ===== 3D の世界：モグラ叩き台・モグラ・人間・ハンマー =====
const lerp = (a, b, t) => a + (b - a) * t;
const easeOut = t => 1 - Math.pow(1 - t, 3);

function lm(color, extra) { return new THREE.MeshLambertMaterial(Object.assign({ color }, extra)); }

function stripeTexture() {
  const c = document.createElement('canvas'); c.width = 256; c.height = 4;
  const g = c.getContext('2d');
  for (let i = 0; i < 16; i++) { g.fillStyle = i % 2 ? '#6a4a94' : '#5a3d82'; g.fillRect(i * 16, 0, 16, 4); }
  const t = new THREE.CanvasTexture(c); t.wrapS = THREE.RepeatWrapping; t.repeat.set(1, 1); return t;
}

// 台：穴の開いた押し出し形。上面は赤いプラスチック、穴の内側は暗い
function buildTable() {
  const HW = 3.9, HD = 4.0, DEPTH = 3.4, R = CFG.holes.r;
  const shape = new THREE.Shape();
  shape.moveTo(-HW, -HD); shape.lineTo(HW, -HD); shape.lineTo(HW, HD); shape.lineTo(-HW, HD); shape.lineTo(-HW, -HD);
  for (let i = 0; i < 9; i++) {
    const p = holePos(i, CFG), hole = new THREE.Path();
    hole.absarc(p.x, -p.z, R, 0, Math.PI * 2, true); shape.holes.push(hole);
  }
  const geo = new THREE.ExtrudeGeometry(shape, { depth: DEPTH, bevelEnabled: false, curveSegments: 32 });
  geo.rotateX(-Math.PI / 2); geo.translate(0, -DEPTH, 0);
  const top = new THREE.MeshPhongMaterial({ color: 0xe8453c, shininess: 70, specular: 0x886666 });
  const side = new THREE.MeshLambertMaterial({ color: 0x2a1a22 });
  const mesh = new THREE.Mesh(geo, [top, side]);
  return mesh;
}

function buildMole() {
  const g = new THREE.Group();
  const fur = lm(0x8a5a3c), dark = lm(0x2a1a14), pink = lm(0xf4a6b0);
  const body = new THREE.Mesh(new THREE.SphereGeometry(0.62, 24, 18), fur); body.scale.set(1, 1.2, 1); body.position.y = 0.62;
  const tube = new THREE.Mesh(new THREE.CylinderGeometry(0.62, 0.62, 1.5, 24), fur); tube.position.y = -0.13;
  g.add(body, tube);
  for (const s of [-1, 1]) {
    const ear = new THREE.Mesh(new THREE.SphereGeometry(0.17, 12, 10), fur); ear.position.set(s * 0.44, 1.2, 0.04); g.add(ear);
    const inner = new THREE.Mesh(new THREE.SphereGeometry(0.1, 10, 8), pink); inner.position.set(s * 0.44, 1.2, -0.08); g.add(inner);
    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.085, 10, 8), dark); eye.position.set(s * 0.24, 0.98, -0.53); g.add(eye);
    const hand = new THREE.Mesh(new THREE.SphereGeometry(0.2, 12, 10), pink); hand.position.set(s * 0.52, 0.2, -0.5); hand.scale.set(1, 0.7, 1.2); g.add(hand);
  }
  const nose = new THREE.Mesh(new THREE.SphereGeometry(0.17, 12, 10), pink); nose.position.set(0, 0.82, -0.62); g.add(nose);
  // 叩かれたときの星
  const stars = new THREE.Group(); stars.position.y = 1.75;
  for (let i = 0; i < 3; i++) {
    const s = new THREE.Mesh(new THREE.OctahedronGeometry(0.17), new THREE.MeshBasicMaterial({ color: 0xffd43b }));
    const a = i / 3 * Math.PI * 2; s.position.set(Math.cos(a) * 0.55, 0, Math.sin(a) * 0.55); stars.add(s);
  }
  stars.visible = false; g.add(stars);
  g.userData.stars = stars;
  return g;
}

function buildHammer() {
  const g = new THREE.Group();
  const wood = lm(0xc98b4b), red = lm(0xe03131), gold = lm(0xffd43b);
  const head = new THREE.Mesh(new THREE.CylinderGeometry(0.62, 0.62, 1.9, 24), red); head.rotation.z = Math.PI / 2; head.position.y = 0.62;
  g.add(head);
  for (const s of [-1, 1]) { const band = new THREE.Mesh(new THREE.CylinderGeometry(0.64, 0.64, 0.14, 24), gold); band.rotation.z = Math.PI / 2; band.position.set(s * 0.8, 0.62, 0); g.add(band); }
  const handle = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.17, 2.6, 12), wood); handle.position.y = 2.0; g.add(handle);
  return g;
}

// 伸びるゴムの腕：from から to まで円柱を張る
function stretch(mesh, a, b, r) {
  const d = new THREE.Vector3().subVectors(b, a), len = d.length();
  mesh.position.copy(a).addScaledVector(d, 0.5);
  mesh.scale.set(r, Math.max(len, 0.01), r);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.normalize());
}

function buildHuman() {
  const g = new THREE.Group();
  const skin = lm(0xffd2a8), shirt = lm(0x3b82f6), white = lm(0xffffff), dark = lm(0x2a1a14), hair = lm(0x4a2c1a), cheek = lm(0xff9a9a), mouthM = lm(0x7a1f1f);
  const torso = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 1.45, 4.0, 24), shirt); torso.position.y = 0.9;
  const shoulders = new THREE.Mesh(new THREE.SphereGeometry(1.2, 24, 16), shirt); shoulders.position.y = 2.9; shoulders.scale.set(1.25, 0.55, 0.9);
  const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.45, 0.6, 12), skin); neck.position.y = 3.2;
  const head = new THREE.Group(); head.position.y = 4.2;
  const skull = new THREE.Mesh(new THREE.SphereGeometry(1.25, 28, 20), skin); head.add(skull);
  const cap = new THREE.Mesh(new THREE.SphereGeometry(1.29, 28, 14, 0, Math.PI * 2, 0, Math.PI * 0.42), hair); cap.position.y = 0.05; head.add(cap);
  const eyes = [], pupils = [], brows = [];
  for (const s of [-1, 1]) {
    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.3, 16, 12), white); eye.position.set(s * 0.46, 0.14, 1.0); eye.scale.set(1, 1.15, 0.7); head.add(eye); eyes.push(eye);
    const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.14, 12, 10), dark); pupil.position.set(s * 0.46, 0.14, 1.2); head.add(pupil); pupils.push(pupil);
    const brow = new THREE.Mesh(new THREE.BoxGeometry(0.58, 0.11, 0.12), hair); brow.position.set(s * 0.5, 0.58, 1.12); head.add(brow); brows.push(brow);
    const ck = new THREE.Mesh(new THREE.SphereGeometry(0.24, 12, 10), cheek); ck.position.set(s * 0.82, -0.3, 0.86); ck.scale.set(1, 0.6, 0.4); head.add(ck);
  }
  const nose = new THREE.Mesh(new THREE.SphereGeometry(0.15, 12, 10), skin); nose.position.set(0, -0.12, 1.27); head.add(nose);
  const smile = new THREE.Mesh(new THREE.TorusGeometry(0.36, 0.06, 8, 20, Math.PI), dark); smile.rotation.z = Math.PI; smile.position.set(0, -0.28, 1.14); head.add(smile);
  const open = new THREE.Mesh(new THREE.SphereGeometry(0.26, 16, 12), mouthM); open.scale.set(1, 1.1, 0.4); open.position.set(0, -0.58, 1.14); head.add(open);
  g.add(torso, shoulders, neck, head);
  const armMat = shirt, armR = new THREE.Mesh(new THREE.CylinderGeometry(1, 1, 1, 12), armMat), armL = new THREE.Mesh(new THREE.CylinderGeometry(1, 1, 1, 12), armMat);
  const handR = new THREE.Mesh(new THREE.SphereGeometry(0.34, 12, 10), skin), handL = new THREE.Mesh(new THREE.SphereGeometry(0.34, 12, 10), skin);
  g.add(armR, armL, handR, handL);
  g.userData = { head, pupils, brows, smile, open, armR, armL, handR, handL };
  return g;
}

// 世界を作って返す
function createWorld(scene) {
  scene.background = new THREE.Color(0x4a2f6b);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x6a5a88, 0.95));
  const sun = new THREE.DirectionalLight(0xfff0dd, 0.75); sun.position.set(3, 9, 7); scene.add(sun);

  // 奥の壁（縞）と床
  const wall = new THREE.Mesh(new THREE.PlaneGeometry(40, 18), new THREE.MeshBasicMaterial({ map: stripeTexture() }));
  wall.position.set(0, 7, -12); scene.add(wall);
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 30), lm(0x2b1d3f)); floor.rotation.x = -Math.PI / 2; floor.position.y = -3.4; scene.add(floor);

  scene.add(buildTable());
  const W = { holes: [], rims: [], moleG: null, human: null, hammer: null, shadow: null, pose: { x: 0, y: 2.2, z: -1.4, tilt: -0.3, s: 1 }, from: null, key: '', puffs: [], shakeReq: 0 };

  for (let i = 0; i < 9; i++) {
    const p = holePos(i, CFG);
    const rim = new THREE.Mesh(new THREE.RingGeometry(CFG.holes.r, CFG.holes.r + 0.2, 32), new THREE.MeshBasicMaterial({ color: 0xffd43b }));
    rim.rotation.x = -Math.PI / 2; rim.position.set(p.x, 0.012, p.z); scene.add(rim);
    W.rims.push(rim); W.holes.push(p);
  }

  W.moleG = buildMole(); scene.add(W.moleG);
  W.human = buildHuman(); W.human.position.set(0, 0, -5.3); scene.add(W.human);
  W.hammer = buildHammer(); scene.add(W.hammer);
  W.shadow = new THREE.Mesh(new THREE.CircleGeometry(1, 28), new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0, depthWrite: false }));
  W.shadow.rotation.x = -Math.PI / 2; W.shadow.position.y = 0.03; scene.add(W.shadow);
  for (let i = 0; i < 12; i++) {
    const m = new THREE.Mesh(new THREE.SphereGeometry(0.28, 8, 6), new THREE.MeshBasicMaterial({ color: 0xf1e3c8, transparent: true, opacity: 0 }));
    m.visible = false; scene.add(m); W.puffs.push({ mesh: m, life: 0, vx: 0, vy: 0, vz: 0 });
  }
  return W;
}

function spawnPuffs(W, x, z, n) {
  let k = 0;
  for (const p of W.puffs) {
    if (p.life > 0 || k >= n) continue;
    const a = Math.random() * Math.PI * 2, sp = 1.2 + Math.random() * 1.6;
    p.life = 0.5 + Math.random() * 0.25; p.max = p.life;
    p.vx = Math.cos(a) * sp; p.vz = Math.sin(a) * sp; p.vy = 1.4 + Math.random() * 1.2;
    p.mesh.position.set(x, 0.2, z); p.mesh.visible = true; k++;
  }
}

// 狙う穴とフェーズからハンマーの姿勢（足元＝頭の底の中心）を決める
function hammerGoal(kind, target) {
  if (kind === 'rest') return { x: 2.3, y: 1.3, z: -3.3, tilt: -0.25 };
  const p = holePos(target, CFG);
  if (kind === 'raised') return { x: p.x, y: 3.7, z: p.z - 0.5, tilt: -0.75 };
  return { x: p.x, y: 0.0, z: p.z, tilt: 0.12 };            // strike
}
const mixPose = (a, b, t) => ({ x: lerp(a.x, b.x, t), y: lerp(a.y, b.y, t), z: lerp(a.z, b.z, t), tilt: lerp(a.tilt, b.tilt, t) });

const _v1 = new THREE.Vector3(), _v2 = new THREE.Vector3();

// ゲームの状態を 3D に反映する
function updateWorld(W, g, dt, now) {
  const m = g.mole, hu = g.human;

  // --- モグラ ---
  const mp = holePos(m.hole, CFG);
  const mg = W.moleG;
  mg.position.set(mp.x, -2.15 + 2.15 * m.h, mp.z);
  mg.visible = m.h > 0.01;
  const flat = m.stun > CFG.mole.stunTime - CFG.mole.flatTime;
  mg.scale.set(flat ? 1.25 : 1, flat ? 0.6 : 1, flat ? 1.25 : 1);
  mg.rotation.z = m.stun > 0 ? Math.sin(now * 30) * 0.12 : Math.sin(now * 9) * 0.04 * m.h;
  const stars = mg.userData.stars;
  stars.visible = m.stun > 0; stars.rotation.y = now * 9;
  stars.position.y = 1.75 + 0.15 * Math.sin(now * 12);
  if (m.stun > 0) mg.visible = true;

  // --- ハンマー ---
  const key = hu.seq;
  if (key !== W.key) { W.key = key; W.from = { x: W.pose.x, y: W.pose.y, z: W.pose.z, tilt: W.pose.tilt }; }
  const rest = hammerGoal('rest'), raised = hu.target >= 0 ? hammerGoal('raised', hu.target) : rest, hitP = hu.target >= 0 ? hammerGoal('strike', hu.target) : rest;
  let pose;
  if (hu.phase === 'windup') {
    const u = clamp(hu.t / CFG.human.windup, 0, 1);
    pose = mixPose(W.from, raised, easeOut(clamp(u / 0.7, 0, 1)));
    if (u > 0.7) { pose.x += Math.sin(now * 55) * 0.06 * (u - 0.7) / 0.3; pose.y += Math.sin(now * 40) * 0.05; }
  } else if (hu.phase === 'strike') {
    const u = clamp(hu.t / CFG.human.strike, 0, 1);
    pose = mixPose(raised, hitP, u * u);
  } else if (hu.phase === 'recover') {
    const u = clamp(hu.t / hu.recover, 0, 1);
    pose = mixPose(hitP, rest, easeOut(clamp((u - 0.35) / 0.65, 0, 1)));
  } else {
    pose = mixPose(W.pose, rest, 1 - Math.exp(-dt * 7));
  }
  W.pose = pose;
  const hm = W.hammer; hm.position.set(pose.x, pose.y, pose.z); hm.rotation.x = pose.tilt;

  // 影と縁（予告）
  const warn = hu.phase === 'windup' || hu.phase === 'strike';
  for (let i = 0; i < 9; i++) W.rims[i].material.color.setHex(warn && i === hu.target ? (Math.floor(now * 14) % 2 ? 0xff3b30 : 0xffd43b) : 0xffd43b);
  if (warn) {
    const tp = holePos(hu.target, CFG), u = hu.phase === 'windup' ? clamp(hu.t / CFG.human.windup, 0, 1) : 1;
    W.shadow.position.set(tp.x, 0.03, tp.z);
    W.shadow.scale.setScalar(lerp(0.5, 1.15, u));
    W.shadow.material.opacity = lerp(0.1, 0.5, u);
  } else W.shadow.material.opacity = Math.max(0, W.shadow.material.opacity - dt * 3);

  // --- 人間 ---
  const U = W.human.userData, headW = U.head;
  const grip = _v1.set(pose.x, pose.y + 2.1 * Math.cos(pose.tilt), pose.z + 2.1 * Math.sin(pose.tilt));
  const humanPos = W.human.position;
  const shR = _v2.set(humanPos.x + 1.65, 2.8, humanPos.z + 0.1);
  stretch(U.armR, shR, grip, 0.3); U.handR.position.copy(grip);
  // 右腕は世界座標で張るので、人間グループの変換を打ち消さないよう位置を直接置く（人間は回転・拡大しない）
  U.armR.position.sub(humanPos); U.handR.position.sub(humanPos);
  const shL = new THREE.Vector3(-1.65, 2.8, 0.1), handLp = new THREE.Vector3(-2.0, 0.6, 1.5);
  stretch(U.armL, shL, handLp, 0.3); U.handL.position.copy(handLp);

  // 表情
  const mood = hu.mood;
  U.smile.visible = mood === 'calm' || mood === 'aim' || mood === 'happy';
  U.open.visible = mood === 'miss';
  U.smile.scale.setScalar(mood === 'happy' ? 1.35 : mood === 'aim' ? 0.7 : 1);
  U.smile.position.y = mood === 'aim' ? -0.42 : -0.28;
  const browTilt = mood === 'aim' ? 0.45 : mood === 'miss' ? -0.35 : mood === 'happy' ? -0.15 : 0;
  U.brows[0].rotation.z = -browTilt; U.brows[1].rotation.z = browTilt;
  U.brows[0].position.y = U.brows[1].position.y = mood === 'miss' ? 0.72 : 0.58;
  // 視線：狙う穴のほうを見る
  const gz = hu.target >= 0 && (hu.phase === 'windup' || hu.phase === 'strike') ? holePos(hu.target, CFG) : { x: 0, z: 0 };
  U.pupils[0].position.x = -0.46 + clamp(gz.x * 0.06, -0.1, 0.1); U.pupils[1].position.x = 0.46 + clamp(gz.x * 0.06, -0.1, 0.1);
  U.pupils[0].position.y = U.pupils[1].position.y = 0.14 - (warn ? 0.07 : 0);
  // 体の動き：振りかぶりで少し反る、空振りで首をふる、当てたら弾む
  let lean = 0, shake = 0, bob = 0;
  if (hu.phase === 'windup') lean = -0.12 * clamp(hu.t / CFG.human.windup, 0, 1);
  else if (hu.phase === 'strike') lean = 0.2;
  else if (hu.phase === 'recover' && hu.mood === 'miss') shake = Math.sin(hu.t * 28) * 0.18 * (1 - hu.t / hu.recover);
  else if (hu.phase === 'recover' && hu.mood === 'happy') bob = Math.abs(Math.sin(hu.t * 12)) * 0.25;
  headW.rotation.x = lean * 0.6; headW.rotation.y = shake; headW.position.y = 4.2 + bob;

  // --- 土ぼこり ---
  for (const p of W.puffs) {
    if (p.life <= 0) continue;
    p.life -= dt;
    if (p.life <= 0) { p.mesh.visible = false; continue; }
    const t = 1 - p.life / p.max;
    p.mesh.position.x += p.vx * dt; p.mesh.position.z += p.vz * dt; p.vy -= 5 * dt; p.mesh.position.y = Math.max(0.1, p.mesh.position.y + p.vy * dt);
    p.mesh.scale.setScalar(0.6 + t * 1.4); p.mesh.material.opacity = 0.75 * (1 - t);
  }
}
// ===== 起動・メインループ・入力・ゲームの流れ =====
// state：title → play → over。play のあいだ、押している穴を stepGame に渡す
(function boot() {
  const $ = id => document.getElementById(id);
  const stage = $('stage'), view = $('view');
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  view.appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  const W = createWorld(scene);
  const camera = new THREE.PerspectiveCamera(60, 9 / 16, 0.1, 80);
  const C = CFG.cam;
  let shakeAmp = 0;
  const holePts = Array.from({ length: 9 }, () => ({ x: 0, y: 0 }));

  function fit() {
    const w = view.clientWidth, h = view.clientHeight;
    renderer.setSize(w, h);
    document.documentElement.style.setProperty('--u', stage.clientWidth / 100 + 'px');
    camera.aspect = w / h;
    const hf = C.hfov * Math.PI / 180;                       // 横の画角を一定にして縦の画角を決める（細い画面でも台が収まる）
    camera.fov = 2 * Math.atan(Math.tan(hf / 2) / camera.aspect) * 180 / Math.PI;
    camera.position.set(C.pos[0], C.pos[1], C.pos[2]);
    camera.lookAt(C.look[0], C.look[1], C.look[2]);
    camera.updateProjectionMatrix(); camera.updateMatrixWorld();
    // 穴の画面上の位置（押した場所から穴を決めるのに使う）
    const v = new THREE.Vector3();
    for (let i = 0; i < 9; i++) {
      const p = holePos(i, CFG); v.set(p.x, 0.3, p.z).project(camera);
      holePts[i].x = (v.x * 0.5 + 0.5) * w; holePts[i].y = (-v.y * 0.5 + 0.5) * h;
    }
  }
  addEventListener('resize', fit); fit();

  // ---- 保存（使えないときは保存しないだけ） ----
  const KEY = 'mole-tease-best';
  let best = 0;
  try { best = parseInt(localStorage.getItem(KEY) || '0', 10) || 0; } catch (e) { }
  function saveBest() { try { localStorage.setItem(KEY, String(best)); } catch (e) { } }

  // ---- 状態 ----
  let state = 'title', g = newGame(CFG), press = -1, ptr = null, freeze = false;
  const hud = $('hud'), hint = $('hint');

  function refreshHud() {
    $('score').textContent = Math.floor(g.score);
    const left = Math.max(0, Math.ceil(CFG.duration - g.t));
    $('time').textContent = left; $('timeBox').classList.toggle('low', left <= 10);
    for (let i = 0; i < 3; i++) $('lump' + i).classList.toggle('on', i < g.bumps);
    $('titleBest').textContent = best;
  }
  function pop(html, cls) {
    const d = document.createElement('div'); d.className = 'pop ' + cls; d.innerHTML = html;
    $('pops').appendChild(d); setTimeout(() => d.remove(), 1150);
  }
  function show(id, on) { $(id).classList.toggle('on', on); }

  function startGame() {
    g = newGame(CFG); press = -1; state = 'play';
    show('titleScr', false); show('overScr', false); hud.classList.add('on');
    hint.classList.add('on'); setTimeout(() => hint.classList.remove('on'), 4200);
    refreshHud();
  }
  function endGame() {
    state = 'over'; press = -1; hud.classList.remove('on'); hint.classList.remove('on');
    const score = Math.floor(g.score), isNew = score > best;
    if (isNew) { best = score; saveBest(); }
    $('overTitle').textContent = g.reason === 'escaped' ? '逃げきり！' : '叩かれた…';
    $('overScore').textContent = score;
    $('overNew').classList.toggle('on', isNew);
    $('overStat').textContent = '空振りさせた ' + g.whiffs + ' 回';
    $('overBest').textContent = '自己ベスト ' + best + ' 点';
    setTimeout(() => show('overScr', true), g.reason === 'escaped' ? 500 : 900);
  }
  $('startBtn').addEventListener('click', startGame);
  $('againBtn').addEventListener('click', startGame);

  // ---- 入力：押している間だけ顔を出す ----
  function holeAt(e, cur) {
    const r = view.getBoundingClientRect();
    return pickHole(e.clientX - r.left, e.clientY - r.top, holePts, cur, 1.25);
  }
  stage.addEventListener('pointerdown', e => {
    if (state !== 'play' || ptr !== null || e.target.closest('.screen')) return;
    ptr = e.pointerId; try { stage.setPointerCapture(e.pointerId); } catch (x) { }
    press = holeAt(e, -1); e.preventDefault();
  });
  stage.addEventListener('pointermove', e => { if (e.pointerId === ptr && state === 'play') press = holeAt(e, press); });
  function release(e) { if (e.pointerId === ptr) { ptr = null; press = -1; } }
  stage.addEventListener('pointerup', release); stage.addEventListener('pointercancel', release);
  addEventListener('blur', () => { ptr = null; press = -1; });

  // ---- 出来事の見た目 ----
  function onEvents(evs) {
    for (const e of evs) {
      if (e.type === 'impact') {
        shakeAmp = Math.max(shakeAmp, e.hit ? 0.28 : 0.12);
        const p = holePos(e.hole, CFG); spawnPuffs(W, p.x, p.z, e.hit ? 8 : 6);
      } else if (e.type === 'whiff') {
        if (e.close >= 0.7) pop(e.label + '<small>+' + e.pts + '</small>', 'great');
        else if (e.close >= 0.35) pop(e.label + '<small>+' + e.pts + '</small>', 'near');
        else pop(e.label + '<small>+' + e.pts + '</small>', 'miss');
        $('scoreBox').classList.remove('bump'); void $('scoreBox').offsetWidth; $('scoreBox').classList.add('bump');
      } else if (e.type === 'bump') {
        pop('ピコッ！', 'bad');
      } else if (e.type === 'end') endGame();
    }
  }

  // ---- メインループ ----
  let last = performance.now(), simT = 0;
  function frame(nowMs) {
    const dt = Math.min(0.05, (nowMs - last) / 1000); last = nowMs; simT += dt;
    if (state === 'play' && !freeze) { onEvents(stepGame(g, dt, press, CFG)); refreshHud(); }
    updateWorld(W, g, dt, simT);
    // 画面のゆれ
    shakeAmp = Math.max(0, shakeAmp - dt * 1.4);
    camera.position.set(C.pos[0] + (Math.random() - 0.5) * shakeAmp, C.pos[1] + (Math.random() - 0.5) * shakeAmp, C.pos[2]);
    camera.lookAt(C.look[0], C.look[1], C.look[2]);
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // 検証用の窓口（遊ぶのには使わない）
  window.__t = {
    start: startGame, state: () => state, game: () => g, holePts: () => holePts.map(p => ({ x: Math.round(p.x), y: Math.round(p.y) })),
    setPress: h => { press = h; }, freeze: f => { freeze = f; }, scene, camera, W,
  };
})();
</script>
